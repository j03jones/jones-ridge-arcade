<body>
<div id="rotate" aria-live="polite"><style>

    flex-direction:column; gap:18px; text-align:center; font:800 18px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; letter-spacing:.08em; }
  #rotate .ph { width:38px; height:64px; border:4px solid #22f0ff; border-radius:9px; box-shadow:0 0 16px rgba(34,240,255,.6); animation:jrTurn 2s ease-in-out infinite; }

</style><div class="ph"></div><div>TURN YOUR PHONE UPRIGHT<small>This game plays in portrait</small></div></div>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="ini" hidden>
  <form autocomplete="off">
    <div class="t">NEW HIGH SCORE!</div>
    <div class="s" id="iniScore"></div>
    <label for="iniIn">ENTER YOUR INITIALS</label>
    <input id="iniIn" maxlength="3" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="done">
    <div class="row"><button type="submit" id="iniSave">SAVE</button><button type="button" class="alt" id="iniSkip">SKIP</button></div>
    <div class="m" id="iniMsg"></div>
  </form>
</div>
<script>
(() => {
'use strict';
/* =====================================================================
   BLUE PLATE RUSH — an original diner counter-service game for the Jones Ridge Arcade.
   Slide orders down four counters, push hungry customers out the door,
   and catch the empty dishes on their way back. Everything is drawn in
   code and every sound is synthesized.
   ===================================================================== */
const GAME_ID = 'rush';
const W = 480, HUD = 44, SIGN = 62, FOOT = 58;
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const UI_FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';

const cv = document.getElementById('c');
let ctx = cv.getContext('2d');
const wrap = document.getElementById('wrap');
let H = 760, dpr = 1;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
function fit() {
  const aw = wrap.clientWidth || innerWidth, ah = wrap.clientHeight || innerHeight;
  let h = Math.round(clamp(W * ah / aw, 700, 1000));
  if (!IS_TOUCH) h = Math.min(h, 860);
  H = h;
  // Render at the size the canvas is actually shown (times the screen density) so it stays sharp when scaled up.
  dpr = Math.max(1, Math.min(3, Math.ceil(Math.min(aw / W, ah / H) * (window.devicePixelRatio || 1) * 4) / 4));
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const k = Math.min(aw / W, ah / H);
  cv.style.width = Math.floor(W * k) + 'px'; cv.style.height = Math.floor(H * k) + 'px';
  bgKey = '';
}
let bgKey = '';
addEventListener('resize', fit);
if (window.visualViewport) visualViewport.addEventListener('resize', fit);

/* ---------------- layout: four counters ---------------- */
const ROWS = 4, DOOR_X = 30, PASS_X = W - 96, CHEF_X = W - 50;
const playTop = () => HUD + SIGN, playBot = () => H - FOOT;
const rowH = () => (playBot() - playTop()) / ROWS;
const counterY = (r) => playTop() + rowH() * (r + 0.74);   // top surface of counter r
const SC = () => clamp(rowH() / 140, 1, 1.4);   // people and food grow on tall screens
const rowAt = (y) => { const r = Math.floor((y - playTop()) / rowH()); return r >= 0 && r < ROWS ? r : -1; };
const STATIONS = [
  { key: 'coffee', name: 'COFFEE', color: '#8a5a3a' },
  { key: 'shake', name: 'SHAKES', color: '#ff7fb5' },
  { key: 'burger', name: 'BURGERS', color: '#f2a03a' },
  { key: 'pie', name: 'PIE', color: '#c8203a' },
];

/* ---------------- storage + leaderboards (all-time + this week) ---------------- */
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
let BOARD = [], WEEK = null, BOARD_SHARED = false, MINE = null;
function loadLocal() { try { const l = JSON.parse(lsGet(GAME_ID + '.top10', '[]')); return Array.isArray(l) ? l : []; } catch (e) { return []; } }
function insertLocal(entry) {
  const l = loadLocal(); l.push(entry); l.sort((a, b) => b.score - a.score);
  const top = l.slice(0, 10); lsSet(GAME_ID + '.top10', JSON.stringify(top)); return { top, rank: top.indexOf(entry) + 1 };
}
async function getJSON(url) { const r = await fetch(url, { cache: 'no-store' }); if (!r.ok) throw new Error(String(r.status)); const d = await r.json(); if (!Array.isArray(d)) throw new Error('bad'); return d; }
async function refreshBoard() {
  try {
    const [all, week] = await Promise.all([getJSON('/api/scores/' + GAME_ID), getJSON('/api/scores/' + GAME_ID + '?board=week').catch(() => null)]);
    BOARD = all; WEEK = week; BOARD_SHARED = true;
  } catch (e) { if (!BOARD_SHARED) { BOARD = loadLocal(); WEEK = null; } }
}
const beats = (list, score) => list.length < 10 || score > list[list.length - 1].score;
function qualifies(score) { return score > 0 && (beats(BOARD, score) || (WEEK !== null && beats(WEEK, score))); }
async function submitScore(name, score, level) {
  const local = insertLocal({ name, score, level, date: new Date().toISOString().slice(0, 10) });
  if (!BOARD_SHARED) { BOARD = local.top; MINE = { name, score, rank: { all: local.rank, week: 0 } }; return true; }
  try {
    const r = await fetch('/api/scores/' + GAME_ID + '?v=2', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, score, level }) });
    if (r.ok) {
      const d = await r.json();
      if (d && Array.isArray(d.all)) { BOARD = d.all; WEEK = Array.isArray(d.week) ? d.week : WEEK; MINE = { name, score, rank: d.rank || { all: 0, week: 0 } }; }
      else if (Array.isArray(d)) { BOARD = d; MINE = { name, score, rank: { all: d.findIndex(e => e.name === name && e.score === score) + 1, week: 0 } }; }
      return true;
    }
    return r.status === 429 ? 'Too many scores from this connection. Try again in a few minutes.' : 'Could not save to the scoreboard (error ' + r.status + ').';
  } catch (e) { return 'Could not reach the scoreboard. Check your connection.'; }
}
function rankLine() {
  if (!MINE || !MINE.rank) return '';
  const { all, week } = MINE.rank;
  if (all) return 'YOU’RE #' + all + (BOARD_SHARED ? ' ALL-TIME!' : ' ON THIS DEVICE!') + (week === 1 && all !== 1 ? '  ·  #1 THIS WEEK' : '');
  if (week) return 'YOU’RE #' + week + ' THIS WEEK!';
  return '';
}
refreshBoard();
function buzz(pattern) { try { if (IS_TOUCH && navigator.vibrate) navigator.vibrate(pattern); } catch (e) {} }

/* ---------------- audio (synthesized) ---------------- */
let ac = null, muted = lsGet(GAME_ID + '.muted', '0') === '1', noiseBuf = null;
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
  if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
  return ac;
}
function tone(f, dur, type = 'square', vol = 0.1, f2 = null, delay = 0) {
  if (muted || !ac) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.2, lp = 1200, delay = 0) {
  if (muted || !ac) return;
  if (!noiseBuf) { noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const t = ac.currentTime + delay, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = lp;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(ac.destination); s.start(t); s.stop(t + dur + 0.02);
}
const sfx = {
  slide() { noise(0.22, 0.09, 2400); tone(520, 0.08, 'triangle', 0.04, 760); },
  serve() { tone(880, 0.07, 'triangle', 0.07); tone(1320, 0.1, 'triangle', 0.05, null, 0.05); },
  out() { [660, 880, 1100].forEach((f, i) => tone(f, 0.08, 'square', 0.04, null, i * 0.05)); },
  catch() { tone(1200, 0.05, 'sine', 0.08); tone(1800, 0.06, 'sine', 0.05, null, 0.03); },
  coin() { tone(1568, 0.07, 'square', 0.04); tone(2093, 0.14, 'square', 0.04, null, 0.06); },
  crash() { noise(0.5, 0.32, 3400); tone(300, 0.3, 'sawtooth', 0.05, 90); },
  angry() { tone(180, 0.35, 'sawtooth', 0.08, 110); tone(150, 0.35, 'square', 0.05, 90, 0.05); },
  bell() { tone(2349, 0.6, 'sine', 0.08); tone(3136, 0.5, 'sine', 0.04); },
  special() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.12, 'triangle', 0.07, null, i * 0.06)); },
  ready() { [784, 1047, 1568].forEach((f, i) => tone(f, 0.1, 'square', 0.05, null, i * 0.07)); },
  life() { [880, 1175, 1760, 2349].forEach((f, i) => tone(f, 0.1, 'triangle', 0.08, null, i * 0.07)); },
  clear() { [392, 523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, 0.14, i % 2 ? 'triangle' : 'square', 0.055, null, i * 0.1)); },
  over() { [440, 370, 294, 220].forEach((f, i) => tone(f, 0.3, 'triangle', 0.09, null, i * 0.22)); },
  move() { tone(420, 0.03, 'square', 0.025); },
  caching() { tone(2637, 0.06, 'triangle', 0.06); tone(3520, 0.12, 'triangle', 0.06, null, 0.05); tone(4186, 0.15, 'triangle', 0.04, null, 0.1); },
  rushStart() { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, 0.1, 'square', 0.06, null, i * 0.04)); },
};

/* ---------------- background music (1950s diner) ---------------- */
let musicNodes = [], musicTimer = null, musicPlaying = false;
const MELODY = [
  523, 523, 659, 784, 880, 784, 659, 523,
  587, 659, 784, 880, 784, 659, 587, 523,
  523, 659, 784, 1047, 880, 784, 659, 523,
  880, 784, 659, 523, 587, 659, 784, 523,
];
const BASS = [
  262, 262, 330, 392, 262, 262, 330, 392,
  294, 294, 349, 392, 294, 294, 262, 262,
  262, 262, 330, 392, 440, 392, 330, 262,
  440, 392, 330, 262, 294, 330, 392, 262,
];
function stopMusic() {
  musicPlaying = false;
  if (musicTimer) { clearTimeout(musicTimer); musicTimer = null; }
  for (const n of musicNodes) { try { n.stop(); } catch (e) {} try { n.disconnect(); } catch (e) {} }
  musicNodes = [];
}
function startMusic() {
  stopMusic();
  if (muted || !ac || G.state !== 'play') return;
  musicPlaying = true;
  scheduleMusicChunk(0);
}
function scheduleMusicChunk(noteIdx) {
  if (!musicPlaying || !ac || muted || G.state !== 'play') { stopMusic(); return; }
  const bpm = G.rushHourActive ? 140 : 120;
  const beatLen = 60 / bpm;
  const now = ac.currentTime;
  for (let i = 0; i < 8; i++) {
    const t = now + i * beatLen;
    const mi = (noteIdx + i) % MELODY.length;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(MELODY[mi], t);
    g.gain.setValueAtTime(0.04, t); g.gain.exponentialRampToValueAtTime(0.0001, t + beatLen * 0.85);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + beatLen);
    musicNodes.push(o);
    const ob = ac.createOscillator(), gb = ac.createGain();
    ob.type = 'square'; ob.frequency.setValueAtTime(BASS[mi], t);
    gb.gain.setValueAtTime(0.025, t); gb.gain.exponentialRampToValueAtTime(0.0001, t + beatLen * 0.7);
    ob.connect(gb).connect(ac.destination); ob.start(t); ob.stop(t + beatLen);
    musicNodes.push(ob);
  }
  musicTimer = setTimeout(() => scheduleMusicChunk((noteIdx + 8) % MELODY.length), 8 * beatLen * 1000 - 100);
}

/* ---------------- customers ---------------- */
// kind: regular, kid (quick, slides far), trucker (needs two plates), critic (never pauses, triple points)
const KINDS = {
  regular: { speed: 1, push: 1, needs: 1, pts: 100, from: 1 },
  kid:     { speed: 1.55, push: 1.35, needs: 1, pts: 150, from: 2 },
  trucker: { speed: 0.85, push: 0.55, needs: 2, pts: 250, from: 3 },
  critic:  { speed: 1.2, push: 0.9, needs: 1, pts: 300, from: 4 },
};
const SKIN = ['#f3d2b3', '#e0ac85', '#c68a5e', '#8d5a3b', '#5e3a26', '#f6dcc4'];
const HAIR = ['#2a1a10', '#5a3418', '#c88a3a', '#1a1a1a', '#8a8a8a', '#a8402a', '#e8d27a'];
const SHIRT = ['#2fb5a8', '#3a6ad8', '#e8a23a', '#7a4ad8', '#4caf50', '#e86a8a', '#f2f2f2', '#d8423a'];

/* ---------------- game state ---------------- */
const G = { state: 'title', t: 0, stateT: 0, titleT: 0, score: 0, lives: 3, shift: 1, nextLife: 30000,
  custs: [], plates: [], returns: [], coins: [], parts: [], pops: [], msg: '', sub: '', msgT: 0, shake: 0,
  quota: 0, spawned: 0, served: 0, spawnT: 0, misses: 0, special: 0, specialReady: false, missT: 0, missWhy: '', missRow: -1, entryHandled: true };
const CHEF = { row: 1, y: 0, serveT: 0, cd: 0, holdT: 0 };
function shiftSpeed() { return Math.min(80, 21 * (1 + 0.16 * (G.shift - 1))); }
function plateSpeed() { return Math.min(560, 400 + 14 * G.shift); }
function returnSpeed() { return Math.min(260, 120 + 12 * G.shift); }
function startShift() {
  G.custs = []; G.plates = []; G.returns = []; G.coins = [];
  G.quota = Math.min(40, 8 + 3 * (G.shift - 1)); G.spawned = 0; G.served = 0; G.spawnT = 0.6; G.misses = 0;
  G.msg = 'SHIFT ' + G.shift; G.sub = G.shift === 1 ? 'THE LUNCH RUSH IS ON!' : 'HERE COME ' + G.quota + ' HUNGRY CUSTOMERS'; G.msgT = 1.8;
  sfx.bell();
}
function startGame() {
  audio();
  G.score = 0; G.lives = 3; G.shift = 1; G.nextLife = 30000; G.special = 0; G.specialReady = false; MINE = null;
  G.parts = []; G.pops = []; CHEF.row = 1; CHEF.y = counterY(1); CHEF.cd = 0;
  startShift();
  G.state = lsGet(GAME_ID + '.tipsSeen', '0') === '1' ? 'play' : 'tips'; G.stateT = 0;
  if (IS_TOUCH) goFull();
}
function toTitle() {
  G.state = 'title'; G.stateT = 0;
  G.titleT = MINE && MINE.rank && !MINE.rank.all && MINE.rank.week ? 7 : 0;
  refreshBoard();
}
function addScore(n) {
  G.score += n;
  while (G.score >= G.nextLife) {
    G.nextLife = G.nextLife < 100000 ? 100000 : G.nextLife < 200000 ? 200000 : G.nextLife + 150000;
    if (G.lives < 5) { G.lives++; sfx.life(); G.msg = 'EXTRA CHEF!'; G.sub = ''; G.msgT = 1.6; buzz([30, 40, 30]); }
  }
}
function best() { return Math.max(+lsGet(GAME_ID + '.best', '0') || 0, BOARD[0] ? BOARD[0].score : 0, G.score); }
function pop(x, y, txt, color = '#ffd84a') { G.pops.push({ x, y, txt, color, t: 1.1 }); }
function burst(x, y, colors, n = 14, speed = 150) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = speed * (0.3 + Math.random());
    G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: 0.4 + Math.random() * 0.5, c: colors[i % colors.length], r: 1.5 + Math.random() * 2.2 });
  }
}
function pickKind() {
  const avail = Object.keys(KINDS).filter(k => KINDS[k].from <= G.shift);
  const r = Math.random();
  if (avail.length === 1 || r < 0.55) return 'regular';
  return avail[1 + Math.floor(Math.random() * (avail.length - 1))];
}
function spawnCustomer() {
  // favour counters with fewer people, never more than 4 on one counter
  const counts = [0, 0, 0, 0]; for (const c of G.custs) counts[c.row]++;
  const cap = G.shift < 4 ? 3 : G.shift < 8 ? 4 : 5;
  const open = [0, 1, 2, 3].filter(r => counts[r] < cap && !G.custs.some(c => c.row === r && c.x < DOOR_X + 40));
  if (!open.length) return false;
  open.sort((a, b) => counts[a] - counts[b] + (Math.random() - 0.5) * 1.6);
  const row = open[0], kind = pickKind(), K = KINDS[kind];
  G.custs.push({ row, kind, x: DOOR_X - 4, state: 'walk', needs: K.needs, push: 0, eatT: 0, stepT: Math.random(), bob: 0,
    skin: SKIN[Math.random() * SKIN.length | 0], hair: HAIR[Math.random() * HAIR.length | 0], shirt: SHIRT[Math.random() * SHIRT.length | 0],
    style: Math.random() * 4 | 0, happyT: 0 });
  G.spawned++;
  return true;
}
function serve(row) {
  if (G.state !== 'play' || CHEF.cd > 0) return;
  if (G.plates.filter(p => p.row === row).length >= 3) return;
  CHEF.cd = 0.16; CHEF.serveT = 0.22;
  const special = G.specialReady;
  if (special) { G.specialReady = false; G.special = 0; sfx.special(); buzz(40); }
  G.plates.push({ row, x: PASS_X - 8, prevX: PASS_X - 8, special, hit: new Set() });
  sfx.slide();
}
function moveChef(row) {
  if (row < 0 || row >= ROWS || G.state !== 'play') return;
  if (row !== CHEF.row) { CHEF.row = row; sfx.move(); }
}
function miss(why, row, x) {
  if (G.state !== 'play') return;
  G.state = 'miss'; G.stateT = 0; G.missWhy = why; G.missRow = row; G.missX = x; G.shake = 0.5; G.misses++;
  if (why === 'HANGRY!') sfx.angry(); else sfx.crash();
  buzz([60, 40, 90]);
  if (why !== 'HANGRY!') burst(x, counterY(row) - 8, ['#ffffff', '#dfe6f0', '#ffd84a'], 22, 220);
}
function afterMiss() {
  G.lives--;
  if (G.lives <= 0) {
    G.state = 'over'; G.stateT = 0; G.entryHandled = false;
    if (G.score > (+lsGet(GAME_ID + '.best', '0') || 0)) lsSet(GAME_ID + '.best', String(G.score));
    sfx.over(); return;
  }
  // clear the counters and pick the shift back up; customers who were inside come back later
  const unserved = G.custs.length; G.spawned = Math.max(0, G.spawned - unserved);

/* ---------------- update ---------------- */
function update(dt) {

  if (CHEF.serveT > 0) CHEF.serveT -= dt;
  if (G.state === 'miss') { if (G.stateT > 1.7) afterMiss(); return; }
  if (G.state === 'clear') {
    if (G.stateT > 2.4) { G.shift++; startShift(); G.state = 'play'; G.stateT = 0; }

  }
  if (G.state !== 'play') return;
  if (CHEF.cd > 0) CHEF.cd -= dt;

        // from shift 3 on, customers often walk in together at different counters
        const group = G.shift < 3 ? 1 : 1 + (Math.random() < Math.min(0.85, 0.45 + 0.08 * (G.shift - 3)) ? 1 : 0) + (G.shift >= 5 && Math.random() < Math.min(0.5, 0.15 + 0.05 * (G.shift - 5)) ? 1 : 0);

    if (c.state === 'walk') {

      .filter(c => c.x + 16 >= p.x && c.x + 16 <= p.prevX + 6).sort((a, b) => b.x - a.x);

      const K = KINDS[c.kind];

      if (p.special) { c.needs = 0; c.state = 'pushed'; c.push = 9999; burst(c.x + 10, counterY(c.row) - 40, ['#ffd84a', '#5ad1ff', '#ff6fb5'], 10, 120); continue; }

    }
  }
  G.plates = G.plates.filter(p => !p.done);
  if (G.state !== 'play') return;

  // ---- empty dishes sliding back to the cook
  const rs = returnSpeed();
  for (const r of G.returns) {
    r.x += rs * dt;
    if (r.x >= PASS_X - 4) {
      if (CHEF.row === r.row) { r.done = true; addScore(25); sfx.catch(); pop(PASS_X - 10, counterY(r.row) - 30, '+25', '#ffffff'); }

    }
  }
  G.returns = G.returns.filter(r => !r.done);
  // ---- tips slide back too; grab them by being on that counter
  for (const c of G.coins) {

    }
  }

  // ---- shift complete?

}

    bigText('SHIFT ' + G.shift + ' DONE!', W / 2, cy - 36, 34, '#ffffff', '#7dffb0');
    text('SHIFT BONUS  +' + G.clearBonus.toLocaleString(), W / 2, cy + 10, 17, '#ffd84a', 'center', '900', 1);
    if (G.clearPerfect) text('PERFECT SHIFT — NO MISTAKES!', W / 2, cy + 40, 13, '#7dffb0', 'center', '900', 1.5);
  } else if (G.state === 'miss') {
    const my = counterY(G.missRow) - 70;
    ctx.save(); ctx.globalAlpha = Math.min(1, G.stateT * 4);
    bigText(G.missWhy, W / 2, clamp(my, HUD + SIGN + 30, H - 140), 44, '#ffffff', '#ff4a3a'); ctx.restore();
  }
  for (const b of menuButtons()) { glassButton(b.x, b.y, b.w, b.h, b.primary); text(b.label, b.x + b.w / 2, b.y + b.h / 2 + 0.5, 14, '#ffffff', 'center', '800', 1.2); }
  if (G.msgT > 0 && G.state === 'play') {
    ctx.globalAlpha = Math.min(1, G.msgT * 2);
    panel(W / 2 - 170, cy - 46, 340, 92);
    bigText(G.msg, W / 2, cy - 12, 34, '#ffffff', '#ff6f9a');
    if (G.sub) text(G.sub, W / 2, cy + 24, 12, '#ffe7a0', 'center', '800', 1.2);
    ctx.globalAlpha = 1;
  }
}
function draw() {
  ensureBg();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (G.shake > 0) ctx.translate((Math.random() - 0.5) * 10 * G.shake, (Math.random() - 0.5) * 10 * G.shake);
  ctx.drawImage(bgCanvas, 0, 0, W, H);
  // heat lamps glow over the counter the cook is working
  for (let r = 0; r < ROWS; r++) { const y = counterY(r); glow(PASS_X + 4, y - 30, 70, '255,170,90', r === CHEF.row && G.state !== 'title' ? 0.22 : 0.06); }
  if (G.state !== 'title') {
    for (let r = 0; r < ROWS; r++) {
      const base = counterY(r) - 9;
      // people stand behind the counter
      for (const c of G.custs) if (c.row === r) drawCustomer(c, c.x, base + 2);
      // the counter top redrawn over their waists
      ctx.fillStyle = lin(0, base - 1, 0, base + 13, [[0, '#e8455a'], [1, '#b3182e']]); ctx.fillRect(DOOR_X - 8, base, PASS_X - DOOR_X + 22, 13);
      ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(DOOR_X - 8, base, PASS_X - DOOR_X + 22, 1.5);
      ctx.fillStyle = lin(0, base + 12, 0, base + 18, [[0, '#ffffff'], [0.5, '#9aa0ac'], [1, '#e2e6ee']]); ctx.fillRect(DOOR_X - 8, base + 12, PASS_X - DOOR_X + 22, 6);
      const k = SC();
      for (const c of G.coins) if (c.row === r) { ctx.save(); ctx.translate(c.x, base + 4); ctx.scale(k, k); drawCoin(0, 0); ctx.restore(); }
      for (const p of G.returns) if (p.row === r) drawItem(p.kind, p.x, base + 4, true, k);
      for (const p of G.plates) if (p.row === r) {
        if (p.special) { glow(p.x, base - 6, 34 * k, '255,216,74', 0.5); for (let j = 1; j < 5; j++) { ctx.globalAlpha = 0.25 / j; drawItem(STATIONS[r].key, p.x + j * 14 * k, base + 4, false, 1.1 * k); } ctx.globalAlpha = 1; }
        else { ctx.globalAlpha = 0.25; drawItem(STATIONS[r].key, p.x + 12 * k, base + 4, false, k); ctx.globalAlpha = 1; }
        drawItem(STATIONS[r].key, p.x, base + 4, false, (p.special ? 1.25 : 1) * k);
      }
      // the cook
      if (r === CHEF.row || Math.abs(CHEF.y - counterY(r)) < rowH() * 0.5) {
        if (r === CHEF.row && G.state !== 'over') { drawChef(CHEF_X, CHEF.y - 4, SC(), CHEF.serveT > 0); if (G.specialReady) glow(CHEF_X, CHEF.y - 40, 50, '255,216,74', 0.18); }
      }
    }
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const p of G.parts) { ctx.globalAlpha = clamp(p.life * 2, 0, 1); circle(p.x, p.y, p.r, p.c); }
    ctx.restore();
    for (const p of G.pops) { ctx.save(); ctx.globalAlpha = clamp(p.t * 2, 0, 1); ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 6; text(p.txt, p.x, p.y, 14, p.color, 'center', '900', 1); ctx.restore(); }
    drawFooter();
  }
  ctx.restore();
  if (G.state === 'title') drawTitle();
  if (G.state === 'tips') drawTips();
  drawOverlays();
  drawHUD();
}

/* ---------------- initials entry ---------------- */
const iniBox = document.getElementById('ini'), iniForm = iniBox.querySelector('form');
const iniIn = document.getElementById('iniIn'), iniMsg = document.getElementById('iniMsg');
const iniSave = document.getElementById('iniSave'), iniSkip = document.getElementById('iniSkip');
function openEntry() {
  entryOpen = true; iniBox.hidden = false; iniMsg.textContent = ''; iniSave.disabled = false;
  document.getElementById('iniScore').textContent = G.score.toLocaleString() + ' POINTS · SHIFT ' + G.shift;
  iniIn.value = lsGet(GAME_ID + '.initials', '');
  setTimeout(() => { try { iniIn.focus(); iniIn.select(); } catch (e) {} }, 60);
}
function closeEntry() { entryOpen = false; iniBox.hidden = true; G.stateT = Math.max(G.stateT, 1.3); try { iniIn.blur(); } catch (e) {} }
iniIn.addEventListener('input', () => { iniIn.value = iniIn.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 3); });
iniForm.addEventListener('submit', async e => {
  e.preventDefault();
  const name = iniIn.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 3);
  if (!name) { iniMsg.textContent = 'Enter 1 to 3 letters or numbers.'; return; }
  lsSet(GAME_ID + '.initials', name);
  iniSave.disabled = true; iniMsg.textContent = '';
  const res = await submitScore(name, G.score, G.shift);
  if (res === true) closeEntry(); else { iniMsg.textContent = res; iniSave.disabled = false; }
});
iniSkip.addEventListener('click', closeEntry);

/* ---------------- loop ---------------- */
fit();
CHEF.y = counterY(CHEF.row);
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.04, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
