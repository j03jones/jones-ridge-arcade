<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<style>
  :root { --bg:#000; --fg:#d8ffe0; }
  html,body { margin:0; position:fixed; inset:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden; overscroll-behavior:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; touch-action:none; -webkit-user-select:none; user-select:none; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; box-sizing:border-box;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  canvas { display:block; background:#000; box-shadow:0 0 40px rgba(80,220,120,.22); }
  #ini { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,10,4,.6); z-index:5; }
  #ini[hidden] { display:none; }
  #ini form { background:linear-gradient(rgba(22,60,36,.95),rgba(5,18,10,.96)); border:2px solid #3fbf6a; border-radius:20px; padding:24px 26px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    text-align:center; width:min(86vw,360px); box-sizing:border-box; box-shadow:0 0 40px rgba(63,191,106,.5); color:#e9ffe9; }
  #ini .t { font:900 26px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; color:#ffd84a; }
  #ini .s { font-weight:bold; font-size:18px; margin:6px 0 16px; }
  #ini label { display:block; font-weight:bold; font-size:14px; color:#a8f0b8; margin-bottom:8px; }
  #ini input { width:4.6em; font:bold 40px "Courier New", monospace; text-align:center; letter-spacing:.3em; padding:6px 0 6px .3em;
    text-transform:uppercase; background:#000; color:#fff; border:2px solid #a8f0b8; border-radius:8px; -webkit-user-select:text; user-select:text; }
  #ini .row { display:flex; gap:10px; justify-content:center; margin-top:16px; }
  #ini button { font:800 17px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; padding:10px 18px; border-radius:8px; border:2px solid #a8f0b8; background:#22783f; color:#fff; cursor:pointer; }
  #ini button.alt { background:transparent; color:#a8f0b8; }
  #ini button:disabled { opacity:.5; }
  #ini .m { min-height:1.3em; margin-top:10px; color:#ff9a9a; font-size:13px; font-weight:bold; }
</style>

<body>
<div id="rotate" aria-live="polite"><style>
  #rotate { display:none; position:fixed; inset:0; z-index:100; background:#05010f; color:#e9e4ff; align-items:center; justify-content:center;
    flex-direction:column; gap:18px; text-align:center; font:800 18px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; letter-spacing:.08em; }
  #rotate .ph { width:38px; height:64px; border:4px solid #22f0ff; border-radius:9px; box-shadow:0 0 16px rgba(34,240,255,.6); animation:jrTurn 2s ease-in-out infinite; }
  #rotate small { display:block; margin-top:6px; font-weight:600; font-size:13px; color:#8f86c9; letter-spacing:.04em; }
  @keyframes jrTurn { 0%,25% { transform:rotate(-90deg); } 60%,100% { transform:rotate(0); } }
  @media (orientation:landscape) and (pointer:coarse) and (max-height:520px) { #rotate { display:flex; } }
</style><div class="ph"></div><div>TURN YOUR PHONE UPRIGHT<small>This game plays in portrait</small></div></div>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="ini" hidden>
  <form autocomplete="off">
    <div class="t">NEW HIGH SCORE!</div>
    <div class="s" id="iniScore"></div>
    <label for="iniIn">ENTER YOUR INITIALS</label>
    <input id="iniIn" maxlength="3" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="done">
    <div class="row"><button type="submit" id="iniSave">SAVE</button><button type="button" class="alt" id="iniSkip">SKIP</button></div>
    <div class="m" id="iniMsg"></div>
  </form>
</div>
<script>
(() => {
'use strict';
/* =====================================================================
   HOP ACROSS — an original crossing game for the Jones Ridge Arcade.
   All graphics are drawn in code and all sounds are synthesized.
   ===================================================================== */
const GAME_ID = 'hop';
const COLS = 13, T = 40, W = COLS * T, ROWS = 13;
const HUD = 44, FIELD = ROWS * T, BAR = 40, BASE_H = HUD + FIELD + BAR;
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const ROW_DOORS = 12, ROW_RAIL = 11, ROW_DOCK = 10, ROW_PARK = 5;
const TIME_LIMIT = 30;

const cv = document.getElementById('c');
let ctx = cv.getContext('2d');
const wrap = document.getElementById('wrap');

let H = BASE_H, PADH = 0, dpr = 1;
function fit() {
  // Measure the space inside the safe-area padding (notches, rounded corners, home bar),
  // not the whole screen, or the game spills off the top and bottom on phones.
  const cs = getComputedStyle(wrap), px = v => parseFloat(v) || 0;
  const aw = Math.max(1, (wrap.clientWidth || innerWidth) - px(cs.paddingLeft) - px(cs.paddingRight));
  const ah = Math.max(1, (wrap.clientHeight || innerHeight) - px(cs.paddingTop) - px(cs.paddingBottom));
  let h = BASE_H;
  if (IS_TOUCH) h = Math.max(BASE_H, Math.min(BASE_H + 560, Math.round(W * ah / aw)));
  PADH = h - BASE_H >= 150 ? h - BASE_H : 0;
  H = BASE_H + PADH;
  // Render at the size the canvas is actually shown (times the screen density) so it stays sharp when scaled up.
  dpr = Math.max(1, Math.min(3, Math.ceil(Math.min(aw / W, ah / H) * (window.devicePixelRatio || 1) * 4) / 4));
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const k = Math.min(aw / W, ah / H);
  cv.style.width = Math.floor(W * k) + 'px'; cv.style.height = Math.floor(H * k) + 'px';
}
fit();
addEventListener('resize', fit);
if (window.visualViewport) visualViewport.addEventListener('resize', fit);

const rowY = r => HUD + (ROWS - 1 - r) * T;      // top edge of a row
const isRoad = r => r >= 1 && r <= 4;
const isRiver = r => r >= 6 && r <= 9;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const snapX = x => clamp(Math.round((x - T / 2) / T) * T + T / 2, T / 2, W - T / 2);

/* ---------------- characters ---------------- */
const CHARS = [
  { id: 'chef', name: 'CHEF' },
  { id: 'pup', name: 'PUP' },
  { id: 'chick', name: 'CHICK' },
  { id: 'raccoon', name: 'RACCOON' },
];

/* ---------------- storage + high score table ---------------- */
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
let BOARD = [], WEEK = null, BOARD_SHARED = false, MINE = null; // MINE = { name, score, rank:{all,week} } after saving
function loadLocal() { try { const l = JSON.parse(lsGet(GAME_ID + '.top10', '[]')); return Array.isArray(l) ? l : []; } catch (e) { return []; } }
function insertLocal(entry) {
  const l = loadLocal(); l.push(entry); l.sort((a, b) => b.score - a.score);
  const top = l.slice(0, 10); lsSet(GAME_ID + '.top10', JSON.stringify(top)); return { top, rank: top.indexOf(entry) + 1 };
}
async function getJSON(url) { const r = await fetch(url, { cache: 'no-store' }); if (!r.ok) throw new Error(String(r.status)); const d = await r.json(); if (!Array.isArray(d)) throw new Error('bad'); return d; }
async function refreshBoard() {
  try {
    const [all, week] = await Promise.all([getJSON('/api/scores/' + GAME_ID), getJSON('/api/scores/' + GAME_ID + '?board=week').catch(() => null)]);
    BOARD = all; WEEK = week; BOARD_SHARED = true;
  } catch (e) { if (!BOARD_SHARED) { BOARD = loadLocal(); WEEK = null; } }
}
const beats = (list, score) => list.length < 10 || score > list[list.length - 1].score;
function qualifies(score) { return score > 0 && (beats(BOARD, score) || (WEEK !== null && beats(WEEK, score))); }
async function submitScore(name, score, level) {
  const local = insertLocal({ name, score, level, date: new Date().toISOString().slice(0, 10) });
  if (!BOARD_SHARED) { BOARD = local.top; MINE = { name, score, rank: { all: local.rank, week: 0 } }; return true; }
  try {
    const r = await fetch('/api/scores/' + GAME_ID + '?v=2', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, score, level }) });
    if (r.ok) {
      const d = await r.json();
      if (d && Array.isArray(d.all)) { BOARD = d.all; WEEK = Array.isArray(d.week) ? d.week : WEEK; MINE = { name, score, rank: d.rank || { all: 0, week: 0 } }; }
      else if (Array.isArray(d)) { BOARD = d; MINE = { name, score, rank: { all: d.findIndex(e => e.name === name && e.score === score) + 1, week: 0 } }; }
      return true;
    }
    return r.status === 429 ? 'Too many scores from this connection. Try again in a few minutes.' : 'Could not save to the scoreboard (error ' + r.status + ').';
  } catch (e) { return 'Could not reach the scoreboard. Check your connection.'; }
}
function rankLine() {
  if (!MINE || !MINE.rank) return '';
  const { all, week } = MINE.rank;
  if (all) return 'YOU’RE #' + all + (BOARD_SHARED ? ' ALL-TIME!' : ' ON THIS DEVICE!') + (week === 1 && all !== 1 ? '  ·  #1 THIS WEEK' : '');
  if (week) return 'YOU’RE #' + week + ' THIS WEEK!';
  return '';
}

/* ---------------- vibration (Android phones; ignored elsewhere) ---------------- */
function buzz(pattern) { try { if (IS_TOUCH && navigator.vibrate && lsGet(GAME_ID + '.buzz', '1') === '1') navigator.vibrate(pattern); } catch (e) {} }
refreshBoard();

/* ---------------- audio (synthesized) ---------------- */
let ac = null, muted = lsGet(GAME_ID + '.muted', '0') === '1', noiseBuf = null;
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
  if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
  return ac;
}
function tone(f, dur, type = 'square', vol = 0.1, f2 = null, delay = 0) {
  if (muted || !ac) return;
  const t = ac.currentTime + delay;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.2, lp = 1200, delay = 0) {
  if (muted || !ac) return;
  if (!noiseBuf) {
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = ac.currentTime + delay;
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = lp;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(ac.destination); s.start(t); s.stop(t + dur + 0.02);
}
const sfx = {
  hop() { tone(420, 0.07, 'square', 0.06, 760); },
  squish() { noise(0.35, 0.3, 900); tone(160, 0.3, 'sawtooth', 0.08, 60); },
  splash() { noise(0.6, 0.25, 2200); tone(500, 0.35, 'sine', 0.08, 120); },
  bonk() { tone(140, 0.18, 'square', 0.12, 90); },
  train() { noise(0.7, 0.35, 500); tone(110, 0.6, 'sawtooth', 0.1, 70); },
  timeout() { tone(440, 0.2, 'triangle', 0.1, 330); tone(330, 0.3, 'triangle', 0.1, 220, 0.2); },
  door() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.12, 'square', 0.07, null, i * 0.07)); },
  order() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.1, 'triangle', 0.09, null, i * 0.06)); },
  clear() { [523, 659, 784, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.16, 'square', 0.07, null, i * 0.11)); },
  life() { [880, 1175, 1760].forEach((f, i) => tone(f, 0.12, 'triangle', 0.09, null, i * 0.08)); },
  tick() { tone(1200, 0.04, 'square', 0.04); },
  bell() { tone(1320, 0.12, 'triangle', 0.06); tone(1100, 0.12, 'triangle', 0.05, null, 0.13); },
  over() { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.25, 'triangle', 0.1, null, i * 0.2)); },
  select() { tone(660, 0.06, 'square', 0.05); },
};

/* ---------------- lanes ---------------- */
const LANE_DEFS = [
  { row: 1, type: 'road',  kind: 'sedan',   dir: -1, speed: 46,  w: 1, n: 4 },
  { row: 2, type: 'road',  kind: 'scooter', dir:  1, speed: 70,  w: 1, n: 3 },
  { row: 3, type: 'road',  kind: 'truck',   dir: -1, speed: 40,  w: 2, n: 3 },
  { row: 4, type: 'road',  kind: 'sports',  dir:  1, speed: 115, w: 1, n: 2 },
  { row: 6, type: 'river', kind: 'log',     dir:  1, speed: 36,  w: 3, n: 4 },
  { row: 7, type: 'river', kind: 'barrel',  dir: -1, speed: 50,  w: 2, n: 5 },
  { row: 8, type: 'river', kind: 'log',     dir:  1, speed: 58,  w: 5, n: 3 },
  { row: 9, type: 'river', kind: 'crate',   dir: -1, speed: 44,  w: 2, n: 5 },
];
const MARGIN = 6 * T, LOOP = W + 2 * MARGIN;
const TRAIN_LEN = 3 * 100;
const CAR_COLORS = ['#e8423c', '#3c8de8', '#f0c23a', '#9b5de5', '#2ec4a6', '#f07c2a'];

const G = {
  state: 'title', stateT: 0, titleT: 0, t: 0, fieldT: 0,
  score: 0, lives: 3, level: 1, nextLife: 10000, time: TIME_LIMIT,
  lanes: [], train: null, trainSpeed: 520, doors: [],
  bonusDoor: null, bonusLeft: 0, bonusT: 8,
  charSel: Math.max(0, CHARS.findIndex(c => c.id === lsGet(GAME_ID + '.char', 'chef'))),
  pops: [], parts: [], msg: '', msgT: 0, death: null, entryHandled: false, lastTick: 99,
};
const P = { x: 0, row: 0, fromX: 0, fromRow: 0, toX: 0, toRow: 0, moving: false, hopT: 0, maxRow: 0, queued: null, face: 'up' };
const HOP_TIME = 0.11;

function buildLanes(level) {
  const f = Math.min(1.9, 1 + 0.1 * (level - 1));
  G.lanes = LANE_DEFS.map(d => {
    let n = d.n, w = d.w;
    if (d.row === 6 && level >= 3) w = 2;
    if (d.kind === 'sports' && level >= 4) n = 3;
    if (d.kind === 'crate' && level >= 5) n = 4;
    const step = LOOP / n, items = [];
    for (let i = 0; i < n; i++) {
      const jit = (Math.random() - 0.5) * Math.max(0, step - w * T - T) * 0.6;
      items.push({ x: -MARGIN + i * step + jit, w, color: CAR_COLORS[(Math.random() * CAR_COLORS.length) | 0],
        sinks: d.kind === 'barrel' && (level >= 3 || i % 2 === 0), ph: Math.random() * 6 });
    }
    return { ...d, w, speed: d.speed * f, items };
  });
  G.train = { phase: 'idle', t: 3 + Math.random() * 4, x: 0, dir: 1, bellT: 0 };
  G.trainSpeed = 520 * Math.min(1.5, f);
}
function resetDoors() { G.doors = [0, 1, 2, 3, 4].map(i => ({ x: 60 + i * 100, filled: null })); G.bonusDoor = null; G.bonusT = 6 + Math.random() * 4; }
function barrelState(it) {
  if (!it.sinks) return 'up';
  const c = (G.fieldT + it.ph) % 6;
  return c < 3.6 ? 'up' : c < 4.4 ? 'dip' : c < 5.4 ? 'under' : 'rise';
}
function laneAt(row) { return G.lanes.find(l => l.row === row); }
buildLanes(1); resetDoors();

/* ---------------- game flow ---------------- */
function resetAttempt() {
  P.x = P.fromX = P.toX = 6 * T + T / 2; P.row = P.fromRow = P.toRow = 0;
  P.moving = false; P.hopT = 0; P.maxRow = 0; P.queued = null; P.face = 'up';
  G.time = TIME_LIMIT; G.lastTick = 99;
}
function startGame() {
  lsSet(GAME_ID + '.char', CHARS[G.charSel].id);
  G.score = 0; G.lives = 3; G.level = 1; G.nextLife = 10000;
  buildLanes(1); resetDoors(); resetAttempt();
  G.pops = []; G.parts = []; G.death = null;
  MINE = null;
  if (lsGet(GAME_ID + '.tipsSeen', '0') !== '1') { G.state = 'tips'; G.stateT = 0; }
  else { G.state = 'play'; G.stateT = 0; showMsg('LEVEL 1 — GO!', 1.6); }
  if (IS_TOUCH) goFull();
}
function toTitle() {
  G.state = 'title'; G.stateT = 0;
  G.titleT = MINE && MINE.rank && !MINE.rank.all && MINE.rank.week ? 7 : 0;  // jump to the weekly page if that's where you placed
  refreshBoard();
}
function toSelect() { G.state = 'select'; G.stateT = 0; sfx.select(); }
function showMsg(m, t) { G.msg = m; G.msgT = t; }
function pop(x, y, txt, color = '#ffd84a') { G.pops.push({ x, y, txt, color, t: 1.1 }); }
function addScore(n) {
  G.score += n;
  while (G.score >= G.nextLife) {
    G.nextLife += 10000;
    if (G.lives < 6) { G.lives++; sfx.life(); showMsg('EXTRA LIFE!', 1.4); }
  }
}
function best() { return Math.max(+lsGet(GAME_ID + '.best', '0') || 0, BOARD[0] ? BOARD[0].score : 0, G.score); }

const DEATH_TEXT = { squish: 'SPLAT!', splash: 'SPLASH!', carried: 'SWEPT AWAY!', train: 'CHOO CHOO!', time: 'OUT OF TIME!', bonk: 'BONK!' };
function die(cause) {
  if (G.state !== 'play') return;
  const y = rowY(P.row) + T / 2;
  G.death = { cause, x: P.x, y, row: P.row };
  G.state = 'dying'; G.stateT = 0; G.lives--;
  P.moving = false; P.queued = null;
  buzz(cause === 'time' ? [60, 60, 60] : 140);
  ({ squish: sfx.squish, splash: sfx.splash, carried: sfx.splash, train: sfx.train, time: sfx.timeout, bonk: sfx.bonk })[cause]();
  const col = cause === 'splash' || cause === 'carried' ? ['#bfe6ff', '#6fb6ff'] : ['#ffd84a', '#ff7a4a'];
  for (let i = 0; i < 16; i++) {
    const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 120;
    G.parts.push({ x: P.x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: 0.6 + Math.random() * 0.4, c: col[i % 2] });
  }
}
function afterDeath() {
  if (G.lives > 0) { resetAttempt(); G.state = 'play'; G.stateT = 0; G.death = null; }
  else {
    G.state = 'over'; G.stateT = 0; G.entryHandled = false; G.death = null;
    if (G.score > (+lsGet(GAME_ID + '.best', '0') || 0)) lsSet(GAME_ID + '.best', String(G.score));
    sfx.over();
  }
}
function landed() {
  P.x = P.toX; P.row = P.toRow; P.moving = false;
  if (P.row > P.maxRow && P.row < ROW_DOORS) { addScore(10 * (P.row - P.maxRow)); P.maxRow = P.row; }
  if (P.row === ROW_DOORS) { reachDoors(); return; }
  if (P.queued) { const q = P.queued; P.queued = null; hop(q); }
}
function reachDoors() {
  const d = G.doors.find(d => Math.abs(d.x - P.x) <= 24);
  if (!d || d.filled) { die('bonk'); return; }
  d.filled = CHARS[G.charSel].id;
  const tb = Math.ceil(G.time) * 10;
  let pts = 50 + tb;
  const y = rowY(ROW_DOORS);
  if (G.bonusDoor === d) { pts += 200; G.bonusDoor = null; sfx.order(); pop(d.x, y + 4, 'ORDER UP! +200', '#7dff9a'); }
  else sfx.door();
  buzz(35);
  addScore(pts);
  pop(d.x, y + 26, '+' + pts);
  if (G.doors.every(d => d.filled)) {
    addScore(1000); sfx.clear(); buzz([40, 50, 40, 50, 80]);
    G.state = 'clear'; G.stateT = 0;
  } else resetAttempt();
}
function nextLevel() {
  G.level++; buildLanes(G.level); resetDoors(); resetAttempt();
  G.state = 'play'; G.stateT = 0; showMsg('LEVEL ' + G.level, 1.6);
}

/* ---------------- movement ---------------- */
function hop(d) {
  if (G.state !== 'play') return;
  if (P.moving) { P.queued = d; return; }
  let tx = P.x, tr = P.row;
  if (d === 'up') tr++; else if (d === 'down') tr--; else if (d === 'left') tx -= T; else tx += T;
  if (tr < 0 || tr > ROW_DOORS) return;
  tx = clamp(tx, T / 2, W - T / 2);
  if (tr !== P.row && !isRiver(tr)) tx = snapX(tx);
  if (tx === P.x && tr === P.row) return;
  P.fromX = P.x; P.fromRow = P.row; P.toX = tx; P.toRow = tr;
  P.moving = true; P.hopT = 0; P.face = d;
  sfx.hop();
}

/* ---------------- input ---------------- */
let entryOpen = false, lastTouch = 0;
function canvasPt(cx, cy) {
  const r = cv.getBoundingClientRect();
  return { x: (cx - r.left) / r.width * W, y: (cy - r.top) / r.height * H };
}
function selRects() {

    circle(ix, ry, 22, 'rgba(255,255,255,.07)');
    if (icon === 'move') drawChar(CHARS[G.charSel].id, ix, ry + 1, 0.8, { t: G.t, noShadow: true });
    else if (icon === 'road') drawVehicle('sedan', { color: '#3c8de8' }, ix - 20, ry - 22, 40, 1);
    else if (icon === 'river') { ctx.beginPath(); ctx.arc(ix, ry, 22, 0, Math.PI * 2); ctx.clip(); ctx.fillStyle = '#1672c6'; ctx.fillRect(ix - 22, ry - 22, 44, 44); drawFloat({ kind: 'log', dir: 1 }, { w: 1 }, ix - 30, ry - 20, 60); }
    else if (icon === 'train') { circle(ix, ry, 9, Math.floor(G.t * 4) % 2 ? '#ff4a3c' : '#4a1512'); if (Math.floor(G.t * 4) % 2) glow(ix, ry, 22, 'rgba(255,70,50,A)', 0.7); }
    else if (icon === 'door') { rr(ix - 14, ry - 12, 28, 26, 3); ctx.fillStyle = lin(0, ry - 12, 0, ry + 14, [[0, '#ffe7ad'], [1, '#c0612a']]); ctx.fill(); for (let k = 0; k < 4; k++) { ctx.fillStyle = k % 2 ? '#fff' : '#24a35a'; ctx.fillRect(ix - 16 + k * 8, ry - 17, 8, 5); } }
    ctx.restore();
    text(l1, x + 88, ry - (l2 ? 9 : 0), 15, '#ffffff', 'left', '700');
    if (l2) text(l2, x + 88, ry + 11, 15, '#b9f5c9', 'left', '600');
  });
  if (G.stateT > 0.4) { ctx.globalAlpha = 0.55 + 0.45 * Math.sin(G.stateT * 4); text(IS_TOUCH ? 'TAP TO START' : 'PRESS ENTER TO START', W / 2, y + h - 26, 15, '#ffffff', 'center', '800', 2); ctx.globalAlpha = 1; }
}
function drawOverlays() {
  const cy = HUD + FIELD / 2;
  if (G.state === 'paused') {
    panel(W / 2 - 180, cy - 74, 360, 152);
    bigText('PAUSED', W / 2, cy - 26, 38, '#ffffff', '#9de8b2');
  } else if (G.state === 'clear') {
    panel(W / 2 - 200, cy - 70, 400, 140);
    bigText('KITCHEN FULL!', W / 2, cy - 22, 36, '#f2fff5', '#3fd474');
    text('LEVEL ' + G.level + ' CLEAR  ·  +1000', W / 2, cy + 26, 16, '#ffd84a', 'center', '800', 1.5);
  } else if (G.state === 'over') {
    panel(W / 2 - 205, cy - 92, 410, 196);
    bigText('GAME OVER', W / 2, cy - 52, 42, '#ffffff', '#ff6a5a');
    text('SCORE ' + G.score.toLocaleString() + '   ·   LEVEL ' + G.level, W / 2, cy - 12, 16, '#ffffff', 'center', '800', 1);
    const rl = rankLine(); if (rl) text(rl, W / 2, cy + 13, 15, '#ffd84a', 'center', '900', 1);
  }
  for (const b of menuButtons()) {
    glassButton(b.x, b.y, b.w, b.h, b.primary);
    text(b.label, b.x + b.w / 2, b.y + b.h / 2 + 0.5, 14, '#ffffff', 'center', '800', 1.2);
  }
  if (G.msgT > 0 && G.state === 'play') {
    ctx.globalAlpha = Math.min(1, G.msgT * 2);
    bigText(G.msg, W / 2, rowY(ROW_PARK) + T / 2, 30, '#ffffff', '#ffe27a');
    ctx.globalAlpha = 1;
  }
}
function draw() {
  ensureBg();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save(); ctx.beginPath(); ctx.rect(0, HUD, W, FIELD); ctx.clip();
  ctx.drawImage(bgCanvas, 0, HUD, W, FIELD);
  drawWater();
  drawDoors();
  drawLaneItems();
  drawTrain();
  if (G.state === 'play' || G.state === 'paused') drawPlayer();
  if (G.state === 'dying') drawDeath();
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const p of G.parts) { ctx.globalAlpha = clamp(p.life * 2, 0, 1); circle(p.x, p.y, 2.6, p.c); }
  ctx.restore();
  for (const p of G.pops) {
    ctx.save(); ctx.globalAlpha = clamp(p.t * 2, 0, 1); ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 6;
    text(p.txt, p.x, p.y, 14, p.color, 'center', '900'); ctx.restore();
  }
  ctx.fillStyle = rad(W / 2, HUD + FIELD / 2, FIELD * 0.38, FIELD * 0.82, [[0, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,.32)']]);
  ctx.fillRect(0, HUD, W, FIELD);
  if (G.state === 'title') drawTitle();
  if (G.state === 'select') drawSelect();
  if (G.state === 'tips') drawTips();
  drawOverlays();
  ctx.restore();
  drawHUD(); drawBar(); drawPad();
}

/* ---------------- initials entry ---------------- */
const iniBox = document.getElementById('ini'), iniForm = iniBox.querySelector('form');
const iniIn = document.getElementById('iniIn'), iniMsg = document.getElementById('iniMsg');
const iniSave = document.getElementById('iniSave'), iniSkip = document.getElementById('iniSkip');
function openEntry() {
  entryOpen = true; iniBox.hidden = false; iniMsg.textContent = ''; iniSave.disabled = false;
  document.getElementById('iniScore').textContent = G.score.toLocaleString() + ' POINTS · LEVEL ' + G.level;
  iniIn.value = lsGet(GAME_ID + '.initials', '');
  setTimeout(() => { try { iniIn.focus(); iniIn.select(); } catch (e) {} }, 60);
}
function closeEntry() { entryOpen = false; iniBox.hidden = true; G.stateT = 1.3; try { iniIn.blur(); } catch (e) {} }
iniIn.addEventListener('input', () => { iniIn.value = iniIn.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 3); });
iniForm.addEventListener('submit', async e => {
  e.preventDefault();
  const name = iniIn.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 3);
  if (!name) { iniMsg.textContent = 'Enter 1 to 3 letters or numbers.'; return; }
  lsSet(GAME_ID + '.initials', name);
  iniSave.disabled = true; iniMsg.textContent = '';
  const res = await submitScore(name, G.score, G.level);
  if (res === true) closeEntry(); else { iniMsg.textContent = res; iniSave.disabled = false; }
});
iniSkip.addEventListener('click', closeEntry);

/* ---------------- loop ---------------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
