<script>
(() => {
'use strict';
const W = 640;
let SS = 2; // canvas pixels per game pixel; follows the on-screen size so the game stays sharp
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
// Height adapts to the screen: 640x480 on desktop/landscape, taller in portrait so phones fill the screen.
let H = 480, TALL = false, UI = 1, HUD_H = 24, TOP = 40, PAD_Y = 444, BH = 16;
const cv = document.getElementById('c');
const homeLink = document.getElementById('home');
const endTop = document.getElementById('endTop');
const endBar = document.getElementById('endbar'), endMain = document.getElementById('endMain'), endHome = document.getElementById('endHome');
const ctx = cv.getContext('2d');
const wrap = document.getElementById('wrap');
function layout(newH) {
  H = newH;
  TALL = H >= 760;
  UI = TALL ? 1.5 : 1;
  HUD_H = TALL ? 44 : 24;
  BH = TALL ? Math.min(24, 16 + Math.round((H - 760) / 60)) : 16;
  TOP = HUD_H + 16 + (TALL ? Math.round((H - 480) * 0.12) : 0);
  PAD_Y = TALL ? H - Math.max(70, Math.round(H * 0.13)) : H - 36;
  cv.width = Math.round(W * SS); cv.height = Math.round(H * SS);
  ctx.setTransform(SS, 0, 0, SS, 0, 0);
}
let onLayout = () => {};
function fit() {
  const aw = wrap.clientWidth || innerWidth, ah = wrap.clientHeight || innerHeight;
  const aspect = ah / aw;
  const newH = aspect > 0.8 ? Math.round(Math.min(1400, W * aspect)) : 480;
  const fitScale = Math.min(aw / W, ah / newH);
  SS = Math.max(1, Math.min(3, Math.ceil(fitScale * (window.devicePixelRatio || 1) * 4) / 4));
  if (newH !== H || cv.width !== Math.round(W * SS)) { layout(newH); onLayout(); }
  const s = Math.min(aw / W, ah / H);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}

/* ---------------- storage ---------------- */
function loadBest() { try { return +localStorage.getItem('boing.best') || 0; } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem('boing.best', String(v)); } catch (e) {} }

/* ---------------- high score table ----------------
   Uses the shared /api/scores endpoint (Cloudflare _worker.js + KV) when it's available,
   otherwise falls back to a top 10 kept in this browser. */
let BOARD = [], WEEK = null, BOARD_SHARED = false, MINE = null; // MINE = { name, score, rank:{all,week} } after saving
function loadLocal() { try { const l = JSON.parse(localStorage.getItem('boing.top10') || '[]'); return Array.isArray(l) ? l : []; } catch (e) { return []; } }
function saveLocal(l) { try { localStorage.setItem('boing.top10', JSON.stringify(l)); } catch (e) {} }
function insertLocal(entry) {
  const l = loadLocal(); l.push(entry); l.sort((a, b) => b.score - a.score);
  const top = l.slice(0, 10); saveLocal(top); return { top, rank: top.indexOf(entry) + 1 };
}
async function getJSON(url) { const r = await fetch(url, { cache: 'no-store' }); if (!r.ok) throw new Error(String(r.status)); const d = await r.json(); if (!Array.isArray(d)) throw new Error('bad'); return d; }
async function refreshBoard() {
  try {
    const [all, week] = await Promise.all([getJSON('/api/scores/boing'), getJSON('/api/scores/boing?board=week').catch(() => null)]);
    BOARD = all; WEEK = week; BOARD_SHARED = true;
  } catch (e) { if (!BOARD_SHARED) { BOARD = loadLocal(); WEEK = null; } }
}
const beats = (list, score) => list.length < 10 || score > list[list.length - 1].score;
function qualifies(score) { return score > 0 && (beats(BOARD, score) || (WEEK !== null && beats(WEEK, score))); }
async function submitScore(name, score, level) {
  const local = insertLocal({ name, score, level, date: new Date().toISOString().slice(0, 10) });
  if (!BOARD_SHARED) { BOARD = local.top; MINE = { name, score, rank: { all: local.rank, week: 0 } }; return true; }
  try {
    const r = await fetch('/api/scores/boing?v=2', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, score, level }) });
    if (r.ok) {
      const d = await r.json();
      if (d && Array.isArray(d.all)) { BOARD = d.all; WEEK = Array.isArray(d.week) ? d.week : WEEK; MINE = { name, score, rank: d.rank || { all: 0, week: 0 } }; }
      else if (Array.isArray(d)) { BOARD = d; MINE = { name, score, rank: { all: d.findIndex(e => e.name === name && e.score === score) + 1, week: 0 } }; }
      return true;
    }
    return r.status === 429 ? 'Too many scores from this connection. Try again in a few minutes.' : 'Could not save to the scoreboard (error ' + r.status + ').';
  } catch (e) { return 'Could not reach the scoreboard. Check your connection.'; }
}
function rankLine() {
  if (!MINE || !MINE.rank) return '';
  const { all, week } = MINE.rank;
  if (all) return 'YOU’RE #' + all + (BOARD_SHARED ? ' ALL-TIME!' : ' ON THIS DEVICE!') + (week === 1 && all !== 1 ? '  ·  #1 THIS WEEK' : '');
  if (week) return 'YOU’RE #' + week + ' THIS WEEK!';
  return '';
}
/* vibration on Android phones (ignored elsewhere) */
function buzz(pattern) { try { if (IS_TOUCH && navigator.vibrate) navigator.vibrate(pattern); } catch (e) {} }
refreshBoard();

/* ---------------- audio (synthesized) ---------------- */
let ac = null, muted = false;
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
  if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
  return ac;
}
function tone(f, dur, type = 'square', vol = 0.12, f2 = null, delay = 0) {
  if (muted || !ac) return;
  const t = ac.currentTime + delay;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g).connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
let noiseBuf = null;
function noise(dur, vol = 0.25, freq = 1200) {
  if (muted || !ac) return;
  if (!noiseBuf) {
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = ac.currentTime;
  const s = ac.createBufferSource(), g = ac.createGain(), fl = ac.createBiquadFilter();
  s.buffer = noiseBuf; fl.type = 'lowpass'; fl.frequency.setValueAtTime(freq, t);
  fl.frequency.exponentialRampToValueAtTime(80, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(fl).connect(g).connect(ac.destination);
  s.start(t); s.stop(t + dur);
}
const sfx = {
  paddle: () => tone(220, 0.08, 'square', 0.1, 330),
  wall:   () => tone(500, 0.04, 'triangle', 0.08),
  brick:  (n = 0) => tone(660 + n * 40, 0.06, 'square', 0.07, 990 + n * 40),
  metal:  () => { tone(1400, 0.12, 'triangle', 0.08, 1300); tone(1900, 0.1, 'sine', 0.05); },
  gold:   () => tone(180, 0.05, 'square', 0.06),
  boom:   () => noise(0.45, 0.35, 2500),
  shot:   () => tone(1200, 0.07, 'sawtooth', 0.05, 300),
  good:   () => { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.1, 'square', 0.07, null, i * 0.05)); },
  bad:    () => { [400, 300, 200].forEach((f, i) => tone(f, 0.14, 'sawtooth', 0.07, null, i * 0.07)); },
  lose:   () => { noise(0.8, 0.4, 1800); tone(300, 0.7, 'sawtooth', 0.08, 40); },
  clear:  () => { [523, 659, 784, 659, 784, 1046].forEach((f, i) => tone(f, 0.16, 'square', 0.08, null, i * 0.11)); },
  launch: () => tone(300, 0.1, 'triangle', 0.1, 900),
  warp:   () => tone(100, 0.6, 'sine', 0.15, 2000),
};

/* ---------------- constants ---------------- */
const COLS = 20, BW = 32;
const PAD_H = 12;
const PAD_SIZES = [34, 54, 78, 108, 144];
const COLORS = {
  r: ['#ff4d4d', '#b01818'], o: ['#ff9a3c', '#b85a0a'], y: ['#ffe14d', '#b39400'],
  g: ['#5dff6a', '#13a020'], c: ['#4df2ff', '#0c94a8'], b: ['#5a7dff', '#1c33b0'],
  p: ['#d06bff', '#7a1db3'], w: ['#f2f2f2', '#9a9a9a'], k: ['#ff6fb5', '#b0236a'],
};

/* Levels: 20 columns; shorter rows are centred. '.' empty, colour letters = normal,
   S = silver (3 hits), G = gold (indestructible), X = explosive */
const LEVELS = [
  ['', '', 'rrrrrrrrrrrrrrrr', 'oooooooooooooooo', 'yyyyyyyyyyyyyyyy', 'gggggggggggggggg', 'cccccccccccccccc', 'bbbbbbbbbbbbbbbb'],
  ['', 'SS', 'rrrr', 'oooooo', 'yyyyyyyy', 'gggXXXXggg', 'cccccccccccc', 'bbbbbbbbbbbbbb', 'pppppppppppppppp'],

  ['', 'pp..pp..pp..pp..pp', 'pp..pp..pp..pp..pp', '..XX..XX..XX..XX..', '..XX..XX..XX..XX..', 'cc..cc..cc..cc..cc', 'cc..cc..cc..cc..cc', '..bb..bb..bb..bb..', '..bb..bb..bb..bb..'],
  ['', '....yyyyyyyy....', '..yyyyyyyyyyyy..', '.yyy.yyyyyy.yyy.', 'yyyyyyyyyyyyyyyy', 'yyyyyyyyyyyyyyyy', 'yyy.yyyyyyyy.yyy', '.yyy.yyyyyy.yyy.', '..yyyy....yyyy..', '....yyyyyyyy....'],
  ['', 'GGGGGGGG....GGGGGGGG', 'rrrrrrrX....Xrrrrrrr', 'oooooooX....Xooooooo', 'SSSSSSSS....SSSSSSSS', '', '....GGGGGGGGGGGG....', '....kkkkkkkkkkkk....', '....wwwwwwwwwwww....'],
  ['', 'c..................c', 'cb................bc', 'cbp..............pbc', 'cbpk............kpbc', 'cbpkr..........rkpbc', 'cbpkro........orkpbc', 'cbpkroy......yorkpbc', 'cbpkroyXXXXXXyorkpbc', 'SSSSSSSSSSSSSSSSSSSS'],
  ['', 'XXXXXXXXXXXXXXXXXXXX', 'g.g.g.g.g.g.g.g.g.g.', '.g.g.g.g.g.g.g.g.g.g', 'g.g.g.g.g.g.g.g.g.g.', '.g.g.g.g.g.g.g.g.g.g', 'g.g.g.g.g.g.g.g.g.g.', 'GGGGGGG......GGGGGGG'],
  ['', '.....rr....rr.....', '....rrrr..rrrr....', '...rrrrrrrrrrrr...', '...rrrrrkkrrrrrr...', '....rrrrkkrrrr....', '.....rrrrrrrr.....', '......rrrrrr......', '.......rrrr.......', '........rr........', '', 'SSSSSS..SSSSSS'],
  ['', 'bbbbbbbbbbbbbbbbbbbb', 'b..................b', 'b.SSSSSSSSSSSSSSSS.b', 'b.S..............S.b', 'b.S.XXXXXXXXXXXX.S.b', 'b.S.X..........X.S.b', 'b.S.X.wwwwwwww.X.S.b', 'b.S.X..........X.S.b', 'b.S.XXXXXXX.XXXX.S.b', 'b.S.........S.....b', 'b.SSSSSSSS..SSSSS.b', 'b..................b', 'bbbbbbbbb..bbbbbbbbb'],
  ['', 'GoGoGoGoGoGoGoGoGoGo', 'oGoGoGoGoGoGoGoGoGoG', '', 'yyyyyyyyyyyyyyyyyyyy', 'SSSSSSSSSSSSSSSSSSSS', 'yyyyyyyyyyyyyyyyyyyy', '', 'XcXcXcXcXcXcXcXcXcXc', 'cXcXcXcXcXcXcXcXcXcX'],
  ['', 'p...p...p...p...p...', '.p...p...p...p...p..', '..p...p...p...p...p.', '...p...p...p...p...p', 'G...G...G...G...G...', 'SSSSSSSSSSSSSSSSSSSS', 'rrrrrrrrrrrrrrrrrrrr', 'oooooooooooooooooooo', 'yyyyyyyyyyyyyyyyyyyy', 'XXXXXXXXXXXXXXXXXXXX'],
];

/* Bonuses: cat good=blue, bad=red, mixed=grey */
const BONUS = [
  { id: 'expand',  name: 'Expand Paddle',    cat: 'mix',  icon: '<->' },
  { id: 'shrink',  name: 'Shrink Paddle',    cat: 'mix',  icon: '>-<' },
  { id: 'split',   name: 'Split Ball',       cat: 'mix',  icon: '3x' },

  { id: 'kill',    name: 'Kill Paddle',      cat: 'bad',  icon: 'XX' },
  { id: 'setoff',  name: 'Set-Off Bombs',cat: 'good', icon: 'BOM' },
  { id: 'warp',    name: 'Level Warp',       cat: 'good', icon: 'WRP' },
  { id: 'smallb',  name: 'Shrink Ball',      cat: 'bad',  icon: 'o' },

  { id: 'multx',   name: 'Multiply Bombs', cat: 'good', icon: 'X+' },
  { id: 'fall',    name: 'Falling Bricks',   cat: 'bad',  icon: 'v v' },
];
const BWEIGHT = { expand: 8, shrink: 7, split: 8, thru: 3, life: 2, kill: 2, setoff: 4, warp: 1.5, smallb: 4, fire: 4,
  zap: 3, fast: 6, gun: 5, slow: 6, tiny: 2, grab: 6, multx: 3, fall: 3 };
const CATCOL = { good: ['#3a5cff', '#0a1a8a'], bad: ['#ff3a3a', '#8a0a0a'], mix: ['#c8c8c8', '#5a5a5a'] };
function pickBonus() {
  let tot = 0; for (const b of BONUS) tot += BWEIGHT[b.id];
  let r = Math.random() * tot;
  for (const b of BONUS) { r -= BWEIGHT[b.id]; if (r <= 0) return b; }
  return BONUS[0];
}

/* ---------------- pre-rendered spinning checker ball ---------------- */
const BALLFRAMES = [];
(function makeBall() {
  const S = 96, R = 44, N = 24;
  for (let f = 0; f < N; f++) {
    const c = document.createElement('canvas'); c.width = c.height = S;
    const g = c.getContext('2d'), img = g.createImageData(S, S), d = img.data;
    const rot = (f / N) * (Math.PI / 4), tilt = 0.35;
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
      const nx = (x - S / 2 + 0.5) / R, ny = (y - S / 2 + 0.5) / R, rr = nx * nx + ny * ny;
      if (rr > 1) continue;
      const nz = Math.sqrt(1 - rr);
      // tilt around z
      const tx = nx * Math.cos(tilt) - ny * Math.sin(tilt), ty = nx * Math.sin(tilt) + ny * Math.cos(tilt);
      const lat = Math.asin(ty), lon = Math.atan2(tx, nz) + rot;
      const chk = (Math.floor(lat / (Math.PI / 8) + 8) + Math.floor(lon / (Math.PI / 8) + 16)) & 1;
      const light = Math.max(0.25, 0.35 + 0.75 * (-nx * 0.4 - ny * 0.5 + nz * 0.75));
      const i = (y * S + x) * 4;
      const col = chk ? [40, 110, 255] : [255, 255, 255];
      d[i] = Math.min(255, col[0] * light); d[i + 1] = Math.min(255, col[1] * light); d[i + 2] = Math.min(255, col[2] * light);
      d[i + 3] = rr > 0.96 ? 180 : 255;
    }
    g.putImageData(img, 0, 0);
    BALLFRAMES.push(c);
  }
})();

/* ---------------- level backgrounds ---------------- */
function makeBg(level) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const hue = (level * 47 + 220) % 360;
  const grd = g.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, `hsl(${hue},55%,9%)`); grd.addColorStop(1, `hsl(${(hue + 40) % 360},60%,4%)`);
  g.fillStyle = grd; g.fillRect(0, 0, W, H);
  const style = level % 4;
  g.globalAlpha = 0.18;
  if (style === 0) {
    for (let y = 0; y < H; y += 32) for (let x = 0; x < W; x += 32)
      if (((x + y) / 32) & 1) { g.fillStyle = `hsl(${hue},60%,30%)`; g.fillRect(x, y, 32, 32); }
  } else if (style === 1) {
    g.strokeStyle = `hsl(${hue},70%,45%)`; g.lineWidth = 1;
    for (let i = -H; i < W; i += 16) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + H, H); g.stroke(); }
  } else if (style === 2) {
    for (let y = 0; y < H; y += 4) {
      g.fillStyle = `hsl(${(hue + y / 3) % 360},70%,${20 + 10 * Math.sin(y / 20)}%)`; g.fillRect(0, y, W, 2);
    }

    for (let i = 0; i < 6; i++) copper(120 + Math.sin(G.t * 1.6 + i * 0.5) * 30 + i * 2, 10, (i * 50 + G.t * 40) % 360);
    chromeText('BOING', W / 2 - 4, 62, 64);
    chromeText('BREAKER', W / 2 + 4, 118, 64);
    const bx = 560 + Math.sin(G.t * 1.3) * 22, by = 300 - Math.abs(Math.sin(G.t * 2.6)) * 70;
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.beginPath(); ctx.ellipse(bx + 14, 362, 40, 9, 0, 0, 7); ctx.fill();
    ctx.drawImage(f, bx - 48, by - 48 + 20);
    if (showScores) drawBoard(250, 168, 18.5, 15, page, pages);
    else {
      text('BONUSES', 30, 168, 14, '#9fb4ff', 'left');
      BONUS.forEach((B, i) => {
        const col = i % 3, row = Math.floor(i / 3);
        const x = 24 + col * 146, y = 196 + row * 30;
        drawCapsule(x + 15, y, B);
        text(B.name, x + 36, y + 1, 11, '#e6e9ff', 'left', true);
      });
    }
    text(hi, W / 2, H - 95, 14, '#ffd84a');
    if (Math.floor(G.t * 2) % 2 === 0) text(prompt, W / 2, H - 70, 16, '#ffffff');
    drawScroller(H - 28, 20);
    return;
  }
  // ---- portrait / tall layout ----
  const logoY = 40 + (H - 760) * 0.08;
  for (let i = 0; i < 7; i++) copper(logoY + 120 + Math.sin(G.t * 1.6 + i * 0.5) * 40 + i * 3, 14, (i * 50 + G.t * 40) % 360);
  chromeText('BOING', W / 2 - 4, logoY + 60, 104);
  chromeText('BREAKER', W / 2 + 4, logoY + 160, 104);
  const legY = logoY + 250;
  if (showScores) drawBoard(W / 2, legY, 37, 26, page, pages);
  else {
    text('BONUSES', 40, legY, 24, '#9fb4ff', 'left');
    BONUS.forEach((B, i) => {
      const col = i % 2, row = Math.floor(i / 2);
      const x = 30 + col * 305, y = legY + 44 + row * 42;
      drawCapsule(x + 27, y, B, 0, 1.75);
      text(B.name, x + 64, y + 1, 21, '#e6e9ff', 'left', true);
    });
  }
  const legEnd = legY + 44 + 8 * 42 + 30;
  const bottom = H - 160;
  if (bottom - legEnd > 110) {
    const zone = bottom - legEnd, floorY = bottom - 10;
    const scale = Math.min(1.6, zone / 140);
    const bx = W / 2 + Math.sin(G.t * 1.3) * 160, by = floorY - 48 * scale - Math.abs(Math.sin(G.t * 2.6)) * Math.max(0, zone - 110 * scale);
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.beginPath(); ctx.ellipse(bx + 10, floorY + 4, 46 * scale, 9 * scale, 0, 0, 7); ctx.fill();
    ctx.drawImage(f, bx - 48 * scale, by - 48 * scale, 96 * scale, 96 * scale);
  }
  text(hi, W / 2, H - 140, 24, '#ffd84a');
  if (Math.floor(G.t * 2) % 2 === 0) text(prompt, W / 2, H - 100, 30, '#ffffff');
  drawScroller(H - 45, 30);
}
function drawHUD() {
  const h = HUD_H, f = TALL ? 21 : 13, cy = h / 2;
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#1b2350'); g.addColorStop(1, '#070a1c');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, h);
  const gl = ctx.createLinearGradient(0, 0, W, 0); gl.addColorStop(0, 'rgba(90,125,255,0)'); gl.addColorStop(0.5, 'rgba(140,170,255,.9)'); gl.addColorStop(1, 'rgba(90,125,255,0)');
  ctx.fillStyle = gl; ctx.fillRect(0, h - 1.5, W, 1.5);
  const sc = String(G.score).padStart(7, '0'), hs = String(Math.max(G.best, G.score, (BOARD[0] && BOARD[0].score) || 0)).padStart(7, '0');
  if (TALL) {
    text(sc, 10, cy, f, '#fff', 'left');
    text('L' + (G.level + 1), 168, cy, f, '#9fb4ff', 'center');
    text('HI ' + hs, 300, cy, f - 3, '#ffd84a', 'center');
    for (let i = 0; i < Math.min(G.lives, 5); i++) { ctx.fillStyle = '#9fb4ff'; rr(392 + i * 18, cy - 5, 14, 10, 5); ctx.fill(); }
  } else {
    text('SCORE', 8, cy, 8, '#9fb4ff', 'left', true, 1.2); text(sc, 44, cy, f, '#fff', 'left');
    text('LEVEL', 218, cy, 8, '#9fb4ff', 'right', true, 1.2); text(String(G.level + 1), 224, cy, f, '#fff', 'left');
    text('HI', 318, cy, 8, '#9fb4ff', 'right', true, 1.2); text(hs, 324, cy, f, '#ffd84a', 'left');
    for (let i = 0; i < Math.min(G.lives, 6); i++) { ctx.fillStyle = '#9fb4ff'; rr(430 + i * 13, cy - 3.5, 10, 7, 3.5); ctx.fill(); }
  }
  const bh = TALL ? h - 12 : h - 5, by = (h - bh) / 2, k = TALL ? 1.15 : 0.62;
  glassBtn(W - 122, by, 52, bh, false); iconSpeaker(W - 96, cy, k, muted);
  glassBtn(W - 62, by, 52, bh, G.state === 'paused'); iconPause(W - 36, cy, k, G.state === 'paused');
}
function draw() {
  if (G.state === 'title') { drawTitle(); return; }
  ctx.drawImage(G.bg, 0, 0);
  ctx.fillStyle = '#3a4580'; ctx.fillRect(0, HUD_H, W, 2);
  ctx.save();
  if (G.shake > 0) ctx.translate((Math.random() - 0.5) * G.shake, (Math.random() - 0.5) * G.shake);
  for (const k of G.bricks) brickShadow(k);
  for (const k of G.bricks) drawBrick(k);
  for (const cp of G.caps) drawCapsule(cp.x, cp.y, cp.b, cp.t, TALL ? 1.35 : 1);
  ctx.fillStyle = '#ffe14d';
  for (const u of G.bullets) ctx.fillRect(u.x - 1.5, u.y - 6, 3, 8);
  if (G.state !== 'over') drawPaddle();
  for (const b of G.balls) drawBall(b);
  for (const p of G.parts) {
    ctx.globalAlpha = Math.min(1, p.life * 2); ctx.fillStyle = p.col;
    if (p.tri) {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.beginPath(); ctx.moveTo(0, -p.s); ctx.lineTo(p.s * 0.8, p.s * 0.6); ctx.lineTo(-p.s * 0.7, p.s * 0.5); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.moveTo(0, -p.s); ctx.lineTo(p.s * 0.3, 0); ctx.lineTo(-p.s * 0.25, 0); ctx.closePath(); ctx.fill();
      ctx.restore();
    } else if (p.glow) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.beginPath(); ctx.arc(p.x, p.y, p.s + 1, 0, 7); ctx.fill(); ctx.restore();
    } else ctx.fillRect(p.x, p.y, p.s, p.s);
  }
  ctx.globalAlpha = 1;
  for (const p of G.pops) {
    if (p.ring) {
      ctx.strokeStyle = `rgba(255,200,80,${p.t * 2.5})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, (0.35 - p.t) * 160 + 8, 0, 7); ctx.stroke();
    }
  }
  ctx.restore();
  drawHUD();
  const cy = TALL ? Math.round(H * 0.5) : 250, u = UI;
  if (G.falling) text('FALLING!', W - 10, HUD_H + 10 * u, 10 * u, '#ff6a6a', 'right');
  if (G.msgT > 0) { ctx.globalAlpha = Math.min(1, G.msgT * 2); text(G.msg, W / 2, PAD_Y - 64 * u, 18 * u, '#ffffff'); ctx.globalAlpha = 1; }
  if (G.state === 'levelintro') {
    for (let i = 0; i < 4; i++) copper(cy - 36 * u + i * 3 + Math.sin(G.t * 3 + i) * 4, 6 * u, (i * 70 + G.t * 60) % 360);
    chromeText('LEVEL ' + (G.level + 1), W / 2, cy, 44 * u);
    text(G.balls.some(b => b.stuck) ? (IS_TOUCH ? 'TAP TO LAUNCH' : 'CLICK OR TAP TO LAUNCH') : '', W / 2, cy + 50 * u, 13 * u, '#cfd8ff');
  }
  if (G.state === 'tips') drawTips(cy, u);
  if (G.state === 'paused') {
    ctx.fillStyle = 'rgba(0,0,10,.55)'; ctx.fillRect(0, HUD_H, W, H - HUD_H);
    glassPanel(W / 2 - 170 * u, cy - 80 * u, 340 * u, 140 * u);
    chromeText('PAUSED', W / 2, cy - 30 * u, 48 * u);
    text(IS_TOUCH ? '' : 'PRESS P TO CONTINUE', W / 2, cy + 25 * u, 14 * u, '#cfd8ff');
  }
  if (G.state === 'over') {
    ctx.fillStyle = 'rgba(0,0,10,.6)'; ctx.fillRect(0, HUD_H, W, H - HUD_H);
    glassPanel(W / 2 - 230 * Math.min(u, 1.3), cy - 105 * u, 460 * Math.min(u, 1.3), 175 * u);
    chromeText('GAME OVER', W / 2, cy - 50 * u, 56 * Math.min(u, 1.35));
    text('SCORE ' + G.score.toLocaleString() + '  \u00B7  LEVEL ' + (G.level + 1), W / 2, cy + 8 * u, 18 * u, '#fff', 'center', true, 1);
    const rl = rankLine();
    if (rl) text(rl, W / 2, cy + 38 * u, 16 * u, '#ffd84a', 'center', true, 1);
    else if (G.newBest) text('NEW PERSONAL BEST!', W / 2, cy + 38 * u, 16 * u, '#ffd84a', 'center', true, 1);
    if (G.stateT > 1.3 && G.entryHandled && !entryOpen && !IS_TOUCH) text('ENTER: TOP 10  \u00B7  ESC: ARCADE', W / 2, cy + 90 * u, 13 * u, '#cfd8ff');
  }
}

function drawTips(cy, u) {
  ctx.fillStyle = 'rgba(0,0,10,.6)'; ctx.fillRect(0, HUD_H, W, H - HUD_H);
  const k = Math.min(u, 1.5), pw = Math.min(W - 30, 520 * k), ph = 352 * k, px = W / 2 - pw / 2, py = cy - ph / 2;
  glassPanel(px, py, pw, ph);
  chromeText('HOW TO PLAY', W / 2, py + 40 * k, 34 * k);
  const pick = cat => BONUS.find(B => B.cat === cat);
  const rows = [
    ['pad', IS_TOUCH ? 'Drag your finger to move the paddle.' : 'Move with the mouse or arrow keys.'],
    ['ball', IS_TOUCH ? 'Tap to launch the ball and fire.' : 'Click or press Space to launch and fire.'],
    [pick('good'), 'Blue capsules help you.'],
    [pick('bad'), 'Red ones hurt — dodge them!'],
    [pick('mix'), 'Grey ones are a gamble.'],
  ];
  rows.forEach(([icon, line], i) => {
    const ry = py + 92 * k + i * 44 * k, ix = px + 46 * k;
    if (icon === 'pad') { rr(ix - 22 * k, ry - 5 * k, 44 * k, 10 * k, 5 * k); ctx.fillStyle = '#9fb4ff'; ctx.fill(); }
    else if (icon === 'ball') { ctx.beginPath(); ctx.arc(ix, ry, 8 * k, 0, 7); const g = ctx.createRadialGradient(ix - 3 * k, ry - 3 * k, 1, ix, ry, 9 * k); g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#8aa0ff'); ctx.fillStyle = g; ctx.fill(); }
    else if (icon) drawCapsule(ix, ry, icon, G.t, 1.2 * k);
    text(line, px + 84 * k, ry + 1, 16 * k, '#e6e9ff', 'left', false);
  });
  if (G.stateT > 0.4 && Math.sin(G.stateT * 4) > -0.6) text(IS_TOUCH ? 'TAP TO START' : 'CLICK OR PRESS SPACE TO START', W / 2, py + ph - 28 * k, 15 * k, '#ffffff', 'center', true, 2);
}

/* ---------------- initials entry ---------------- */
const ini = document.getElementById('ini'), iniIn = document.getElementById('iniIn'), iniMsg = document.getElementById('iniMsg');
const iniSave = document.getElementById('iniSave'), iniSkip = document.getElementById('iniSkip'), iniScore = document.getElementById('iniScore');
let entryOpen = false;
function endMainAction() {
  audio();
  if (G.state === 'paused') togglePause();
  else if (G.state === 'over') { if (IS_TOUCH) goFull(); startGame(); }
}
endMain.addEventListener('click', e => { e.stopPropagation(); endMainAction(); });
endTop.addEventListener('click', e => { e.stopPropagation(); toTitle(); });
endHome.addEventListener('click', e => { e.stopPropagation(); location.href = '/'; });
function toTitle() {
  G.state = 'title'; G.stateT = 0;
  G.titleT = MINE && MINE.rank && !MINE.rank.all && MINE.rank.week ? 7 : 0;  // open on the weekly page if that's where you placed
  refreshBoard();
}
function openEntry() {
  entryOpen = true;
  if (locked) document.exitPointerLock();
  iniScore.textContent = 'SCORE ' + G.score + '  \u00b7  LEVEL ' + (G.level + 1);
  try { iniIn.value = localStorage.getItem('boing.initials') || ''; } catch (e) { iniIn.value = ''; }
  iniMsg.textContent = ''; iniSave.disabled = false; ini.hidden = false;
  if (!IS_TOUCH) setTimeout(() => { try { iniIn.focus(); iniIn.select(); } catch (e) {} }, 50);
}
function closeEntry() { ini.hidden = true; entryOpen = false; iniIn.blur(); G.stateT = Math.max(G.stateT, 1.3); }
iniIn.addEventListener('input', () => {
  const v = iniIn.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 3);
  if (v !== iniIn.value) iniIn.value = v;
});
ini.querySelector('form').addEventListener('submit', async e => {
  e.preventDefault();
  const name = iniIn.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 3);
  if (!name) { iniMsg.textContent = 'Enter 1 to 3 letters or numbers.'; return; }
  try { localStorage.setItem('boing.initials', name); } catch (err) {}
  iniSave.disabled = true; iniMsg.textContent = 'Saving...';
  const res = await submitScore(name, G.score, G.level + 1);
  if (res === true) { G.lastEntry = { name, score: G.score }; sfx.clear(); closeEntry(); }
  else { iniMsg.textContent = res; iniSave.disabled = false; }
});
iniSkip.addEventListener('click', () => closeEntry());

/* ---------------- loop ---------------- */
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
onLayout = () => {
  for (const k of G.bricks) k.y = TOP + k.r * BH;
  if (G.state !== 'title') G.bg = makeBg(G.level);
  G.caps = G.caps.filter(c => c.y < PAD_Y);
};
addEventListener('resize', fit);
if (window.visualViewport) visualViewport.addEventListener('resize', fit);
fit();
requestAnimationFrame(frame);
})();
</script>
