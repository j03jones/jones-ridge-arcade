(() => {
'use strict';
/* =====================================================================
   CHOMPER — a Pac-Man-style maze chase game for the Jones Ridge Arcade.
   Kitchen/diner theme. All graphics drawn in code, all sounds synthesized.
   ===================================================================== */
const GAME_ID = 'chomp';
const TILE = 16, COLS = 28, ROWS = 31;
const MW = COLS * TILE, MH = ROWS * TILE;
const HUD = 44, BAR = 40, BASE_H = HUD + MH + BAR;
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const W = MW;

const cv = document.getElementById('c');
let ctx = cv.getContext('2d');
const wrap = document.getElementById('wrap');

let H = BASE_H, PADH = 0, dpr = 1;
function fit() {
  // Measure the space inside the safe-area padding (notches, rounded corners, home bar),
  // not the whole screen, or the game spills off the top and bottom on phones.
  const cs = getComputedStyle(wrap), px = v => parseFloat(v) || 0;
  const aw = Math.max(1, (wrap.clientWidth || innerWidth) - px(cs.paddingLeft) - px(cs.paddingRight));
  const ah = Math.max(1, (wrap.clientHeight || innerHeight) - px(cs.paddingTop) - px(cs.paddingBottom));
  let h = BASE_H;
  if (IS_TOUCH) h = Math.max(BASE_H, Math.min(BASE_H + 560, Math.round(W * ah / aw)));
  PADH = h - BASE_H >= 150 ? h - BASE_H : 0;
  H = BASE_H + PADH;
  dpr = Math.max(1, Math.min(3, Math.ceil(Math.min(aw / W, ah / H) * (window.devicePixelRatio || 1) * 4) / 4));
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const k = Math.min(aw / W, ah / H);
  cv.style.width = Math.floor(W * k) + 'px'; cv.style.height = Math.floor(H * k) + 'px';
}
fit();
addEventListener('resize', fit);
if (window.visualViewport) visualViewport.addEventListener('resize', fit);

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ===================== MAZE DEFINITIONS ===================== */
// Each maze is a string grid: # = wall, . = dot, o = power pellet, - = ghost door, G = ghost house interior, P = player start, F = fruit spot, E = empty

// Clean up mazes - ensure each row is exactly 28 chars
for (let m = 0; m < MAZES.length; m++) {
  for (let r = 0; r < MAZES[m].length; r++) {
    let row = MAZES[m][r];
    if (row.length < COLS) row = row + '#'.repeat(COLS - row.length);
    if (row.length > COLS) row = row.slice(0, COLS);
    MAZES[m][r] = row;
  }
  // Ensure exactly 31 rows
  while (MAZES[m].length < ROWS) MAZES[m].push('#'.repeat(COLS));
}

/* ===================== STORAGE + LEADERBOARD ===================== */
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
let BOARD = [], WEEK = null, BOARD_SHARED = false, MINE = null;
function loadLocal() { try { const l = JSON.parse(lsGet(GAME_ID + '.top10', '[]')); return Array.isArray(l) ? l : []; } catch (e) { return []; } }
function insertLocal(entry) {
  const l = loadLocal(); l.push(entry); l.sort((a, b) => b.score - a.score);
  const top = l.slice(0, 10); lsSet(GAME_ID + '.top10', JSON.stringify(top)); return { top, rank: top.indexOf(entry) + 1 };
}
async function getJSON(url) { const r = await fetch(url, { cache: 'no-store' }); if (!r.ok) throw new Error(String(r.status)); const d = await r.json(); if (!Array.isArray(d)) throw new Error('bad'); return d; }
async function refreshBoard() {
  try {
    const [all, week] = await Promise.all([getJSON('/api/scores/' + GAME_ID), getJSON('/api/scores/' + GAME_ID + '?board=week').catch(() => null)]);
    BOARD = all; WEEK = week; BOARD_SHARED = true;
  } catch (e) { if (!BOARD_SHARED) { BOARD = loadLocal(); WEEK = null; } }
}
const beats = (list, score) => list.length < 10 || score > list[list.length - 1].score;
function qualifies(score) { return score > 0 && (beats(BOARD, score) || (WEEK !== null && beats(WEEK, score))); }
async function submitScore(name, score, level) {
  const local = insertLocal({ name, score, level, date: new Date().toISOString().slice(0, 10) });
  if (!BOARD_SHARED) { BOARD = local.top; MINE = { name, score, rank: { all: local.rank, week: 0 } }; return true; }
  try {
    const r = await fetch('/api/scores/' + GAME_ID + '?v=2', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, score, level }) });
    if (r.ok) {
      const d = await r.json();
      if (d && Array.isArray(d.all)) { BOARD = d.all; WEEK = Array.isArray(d.week) ? d.week : WEEK; MINE = { name, score, rank: d.rank || { all: 0, week: 0 } }; }
      else if (Array.isArray(d)) { BOARD = d; MINE = { name, score, rank: { all: d.findIndex(e => e.name === name && e.score === score) + 1, week: 0 } }; }
      return true;
    }
    return r.status === 429 ? 'Too many scores from this connection. Try again in a few minutes.' : 'Could not save to the scoreboard (error ' + r.status + ').';
  } catch (e) { return 'Could not reach the scoreboard. Check your connection.'; }
}
function rankLine() {
  if (!MINE || !MINE.rank) return '';
  const { all, week } = MINE.rank;
  if (all) return 'YOU\'RE #' + all + (BOARD_SHARED ? ' ALL-TIME!' : ' ON THIS DEVICE!') + (week === 1 && all !== 1 ? '  ·  #1 THIS WEEK' : '');
  if (week) return 'YOU\'RE #' + week + ' THIS WEEK!';
  return '';
}

/* ===================== VIBRATION ===================== */
function buzz(pattern) { try { if (IS_TOUCH && navigator.vibrate && lsGet(GAME_ID + '.buzz', '1') === '1') navigator.vibrate(pattern); } catch (e) {} }
refreshBoard();

/* ===================== AUDIO ===================== */
let ac = null, muted = lsGet(GAME_ID + '.muted', '0') === '1', noiseBuf = null;
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
  if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
  return ac;
}
function tone(f, dur, type = 'square', vol = 0.1, f2 = null, delay = 0) {
  if (muted || !ac) return;
  const t = ac.currentTime + delay;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.2, lp = 1200, delay = 0) {
  if (muted || !ac) return;
  if (!noiseBuf) {
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = ac.currentTime + delay;
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = lp;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(ac.destination); s.start(t); s.stop(t + dur + 0.02);
}

// Music system
let musicOscs = [], musicPlaying = false, musicGain = null, musicTempo = 1;
function startMusic() {
  if (muted || !ac || musicPlaying) return;
  musicPlaying = true;
  musicGain = ac.createGain();
  musicGain.gain.value = 0.04;
  musicGain.connect(ac.destination);
  playMusicLoop();
}
function stopMusic() {
  musicPlaying = false;
  for (const o of musicOscs) { try { o.stop(); } catch(e) {} }
  musicOscs = [];
  if (musicGain) { musicGain.disconnect(); musicGain = null; }
}
function playMusicLoop() {
  if (!musicPlaying || !ac || muted) return;
  // Jazzy chase melody - repeating pattern
  const notes = [392, 440, 494, 523, 494, 440, 392, 349, 330, 349, 392, 440, 392, 349, 330, 294];
  const bassDur = 0.15 / musicTempo;
  const now = ac.currentTime;
  for (let i = 0; i < notes.length; i++) {
    const t = now + i * bassDur;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'square'; o.frequency.setValueAtTime(notes[i], t);
    g.gain.setValueAtTime(0.03, t); g.gain.exponentialRampToValueAtTime(0.001, t + bassDur * 0.9);
    o.connect(g).connect(musicGain || ac.destination);
    o.start(t); o.stop(t + bassDur);
    musicOscs.push(o);
    // Bass line
    if (i % 4 === 0) {
      const ob = ac.createOscillator(), gb = ac.createGain();
      ob.type = 'triangle'; ob.frequency.setValueAtTime(notes[i] / 2, t);
      gb.gain.setValueAtTime(0.04, t); gb.gain.exponentialRampToValueAtTime(0.001, t + bassDur * 3.5);
      ob.connect(gb).connect(musicGain || ac.destination);
      ob.start(t); ob.stop(t + bassDur * 4);
      musicOscs.push(ob);
    }
  }
  const loopTime = notes.length * bassDur * 1000;
  setTimeout(() => {
    musicOscs = musicOscs.filter(o => { try { return true; } catch(e) { return false; } });
    if (musicPlaying) playMusicLoop();
  }, loopTime - 50);
}

const sfx = {

const DX = [1, 0, -1, 0];

const GHOST_NAMES = ['ROACH', 'RAT', 'FLY', 'ANT'];
const GHOST_COLORS = ['#e84040', '#ffb0c0', '#40e0e0', '#ff9030'];
const GHOST_CORNER = [

function makeGhost(idx) {

    mode: 'house', // house, leaving, scatter, chase, frightened, eaten
    houseTimer: idx * 2.5 + 1, // stagger exits

/* ===================== MAZE HELPERS ===================== */
let playerStart = {x: 14, y: 23};
let ghostHouse = {x: 12, y: 13, w: 4, h: 2}; // center of ghost house
let ghostDoor = {x: 13, y: 12}; // door position (the '-' tile)
let fruitPos = {x: 14, y: 17};
let tunnels = []; // [{y, leftX, rightX}]

function parseMaze(idx) {
  const src = MAZES[idx % MAZES.length];
  const maze = [];
  const dots = [];
  let dotCount = 0;
  tunnels = [];
  
  for (let y = 0; y < ROWS; y++) {
    maze[y] = [];
    dots[y] = [];
    for (let x = 0; x < COLS; x++) {
      const ch = src[y][x];
      if (ch === '#') { maze[y][x] = 1; dots[y][x] = 0; } // wall
      else if (ch === '-') { maze[y][x] = 2; dots[y][x] = 0; } // ghost door
      else if (ch === 'G') { maze[y][x] = 3; dots[y][x] = 0; } // ghost house
      else if (ch === 'E') { maze[y][x] = 4; dots[y][x] = 0; } // empty/outside
      else {
        maze[y][x] = 0; // path
        if (ch === '.') { dots[y][x] = 1; dotCount++; }
        else if (ch === 'o') { dots[y][x] = 2; dotCount++; } // power pellet
        else dots[y][x] = 0;
        if (ch === 'P') { playerStart = {x, y}; dots[y][x] = 0; }
        if (ch === 'F') { fruitPos = {x, y}; dots[y][x] = 0; }
      }
    }
    // Detect tunnels (E at edges)
    if (src[y][0] === 'E' && src[y][COLS-1] === 'E') {
      // Find the path row in between
      let leftPath = -1, rightPath = -1;
      for (let x = 0; x < COLS; x++) {
        if (maze[y][x] === 0 || maze[y][x] === 4) {
          if (leftPath < 0) leftPath = x;
          rightPath = x;
        }
      }
      // Make outside tiles walkable for tunnel
      for (let x = 0; x < COLS; x++) {
        if (maze[y][x] === 4) maze[y][x] = 0;
      }
      tunnels.push({y, leftX: 0, rightX: COLS - 1});
    }
  }
  
  // Find ghost house and door
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (maze[y][x] === 2) { // ghost door
        ghostDoor = {x, y};
        // Ghost house is below the door
        ghostHouse = {x: x - 1, y: y + 1, w: 4, h: 2};
      }
    }
  }
  
  G.maze = maze;
  G.dots = dots;
  G.dotCount = dotCount;
  G.dotsEaten = 0;
}

function isWalkable(x, y, isGhost, isEaten) {
  if (y < 0 || y >= ROWS) return false;
  // Wrap x for tunnel
  if (x < 0 || x >= COLS) {
    // Check if this y has a tunnel
    return tunnels.some(t => t.y === y);
  }
  const cell = G.maze[y][x];
  if (cell === 0) return true; // path
  if (cell === 2) return isGhost; // ghost door
  if (cell === 3) return isGhost; // ghost house interior
  return false;
}

function wrapX(x) {
  if (x < 0) return COLS - 1;
  if (x >= COLS) return 0;
  return x;
}

/* ===================== SCATTER/CHASE TIMING ===================== */
// Each level has phases: scatter X seconds, then chase Y seconds, repeating
function getScatterChaseTime(phase, level) {
  const l = Math.min(level, 5);
  // Phase 0,2,4: scatter; Phase 1,3,5: chase; Phase 6: permanent chase
  const scatterTimes = l <= 1 ? [7, 7, 5, 5] : l <= 4 ? [7, 7, 5, 0.016] : [5, 5, 5, 0.016];
  const chaseTimes = l <= 1 ? [20, 20, 20, Infinity] : l <= 4 ? [20, 20, 20, Infinity] : [20, 20, 20, Infinity];
  const idx = Math.floor(phase / 2);
  if (idx >= scatterTimes.length) return { scatter: 0, chase: Infinity };
  return phase % 2 === 0 ? { time: scatterTimes[idx], isScatter: true } : { time: chaseTimes[idx], isScatter: false };
}

/* ===================== GAME FLOW ===================== */
function initLevel() {
  parseMaze(G.mazeIdx);
  
  // Place player
  P.x = playerStart.x;
  P.y = playerStart.y;
  P.dir = 2; // face left
  P.nextDir = -1;
  P.alive = true;
  P.mouthAngle = 0;
  
  // Init ghosts
  ghosts = [];
  for (let i = 0; i < 4; i++) {
    const g = makeGhost(i);
    // Place in ghost house
    g.x = ghostHouse.x + (i % 3);
    g.y = ghostHouse.y + Math.floor(i / 3);
    if (i === 0) { // Roach starts outside
      g.x = ghostDoor.x;
      g.y = ghostDoor.y - 1;
      g.mode = 'scatter';
      g.houseTimer = 0;
    }
    g.dir = i % 2 === 0 ? 0 : 2;
    ghosts.push(g);
  }
  
  G.frightTimer = 0;
  G.ghostEatCombo = 0;
  G.fruit = null;
  G.fruitTimer = 0;
  G.fruitsShown = 0;
  G.scatterPhase = 0;
  G.scatterTimer = 0;
  G.scatterMode = true;
  G.readyTimer = 2.0;
  G.deathTimer = 0;
  G.levelCompleteTimer = 0;
  G.flashTimer = 0;
  
  updateSpeeds();
}

function updateSpeeds() {
  const l = G.level;
  const baseSpeed = 4.5 + Math.min(l * 0.3, 2.5); // tiles per second
  P.speed = baseSpeed * 0.85;
  
  for (const g of ghosts) {
    if (g.mode === 'frightened') g.speed = baseSpeed * 0.5;
    else if (g.mode === 'eaten') g.speed = baseSpeed * 2;
    else g.speed = baseSpeed * (0.75 + Math.min(l * 0.02, 0.15));
  }
}

function startGame() {
  G.score = 0; G.lives = 3; G.level = 1; G.nextLife = 10000;
  G.mazeIdx = 0;
  G.pops = []; G.parts = [];
  G.msg = ''; G.msgT = 0;
  MINE = null;
  initLevel();
  G.state = 'play'; G.stateT = 0;
  startMusic();
  if (IS_TOUCH) goFull();
}

function nextLevel() {
  G.level++;
  G.mazeIdx = (G.mazeIdx + 1) % MAZES.length;
  initLevel();
  G.state = 'play'; G.stateT = 0;
  showMsg('LEVEL ' + G.level, 1.6);
  startMusic();
}

function showMsg(m, t) { G.msg = m; G.msgT = t; }
function pop(x, y, txt, color = '#ffd84a') { G.pops.push({ x, y, txt, color, t: 1.1 }); }

function addScore(n) {
  G.score += n;
  while (G.score >= G.nextLife) {
    G.nextLife += 10000;
    if (G.lives < 6) { G.lives++; sfx.extraLife(); showMsg('EXTRA LIFE!', 1.4); }
  }
}

function best() { return Math.max(+lsGet(GAME_ID + '.best', '0') || 0, BOARD[0] ? BOARD[0].score : 0, G.score); }

function killPlayer() {
  if (!P.alive) return;
  P.alive = false;
  G.deathTimer = 2.0;
  G.lives--;
  stopMusic();
  sfx.death();
  buzz(140);
  // Death particles
  const px = (P.x + 0.5) * TILE, py = HUD + (P.y + 0.5) * TILE;
  for (let i = 0; i < 20; i++) {
    const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 80;
    G.parts.push({ x: px, y: py, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: 0.6 + Math.random() * 0.4, c: i % 2 ? '#ffd84a' : '#ff7a4a' });
  }
}

function afterDeath() {
  if (G.lives > 0) {
    // Reset positions
    P.x = playerStart.x; P.y = playerStart.y; P.dir = 2; P.nextDir = -1; P.alive = true;
    for (let i = 0; i < ghosts.length; i++) {
      const g = ghosts[i];
      g.x = ghostHouse.x + (i % 3); g.y = ghostHouse.y + Math.floor(i / 3);
      g.mode = 'house'; g.houseTimer = i * 2 + 1;
      if (i === 0) { g.x = ghostDoor.x; g.y = ghostDoor.y - 1; g.mode = 'scatter'; g.houseTimer = 0; }
    }
    G.frightTimer = 0; G.ghostEatCombo = 0;
    G.readyTimer = 2.0;
    G.state = 'play'; G.deathTimer = 0;
    startMusic();
  } else {
    G.state = 'over'; G.stateT = 0; G.entryHandled = false;
    if (G.score > (+lsGet(GAME_ID + '.best', '0') || 0)) lsSet(GAME_ID + '.best', String(G.score));
    sfx.over();
  }
}

function toTitle() {
  G.state = 'title'; G.stateT = 0;
  G.titleT = MINE && MINE.rank && !MINE.rank.all && MINE.rank.week ? 7 : 0;
  stopMusic();
  refreshBoard();
}

/* ===================== GHOST AI ===================== */
function ghostTarget(g) {
  if (g.mode === 'scatter') return GHOST_CORNER[g.idx];
  if (g.mode === 'eaten') return {x: ghostDoor.x, y: ghostDoor.y};
  
  // Chase targets
  switch (g.idx) {
    case 0: // Roach - targets player directly (Blinky)
      return {x: P.x, y: P.y};
    case 1: { // Rat - targets 4 tiles ahead of player (Pinky)
      let tx = P.x + DX[P.dir] * 4;
      let ty = P.y + DY[P.dir] * 4;
      // Classic Pinky bug: when facing up, also offset 4 left
      if (P.dir === 3) tx -= 4;
      return {x: tx, y: ty};
    }
    case 2: { // Fly - Inky style: double the vector from Roach to 2 tiles ahead of player
      const ahead = {x: P.x + DX[P.dir] * 2, y: P.y + DY[P.dir] * 2};
      const roach = ghosts[0];
      return {x: ahead.x * 2 - roach.x, y: ahead.y * 2 - roach.y};
    }
    case 3: { // Ant - Clyde style: chase when far, scatter when close
      const dist = Math.abs(g.x - P.x) + Math.abs(g.y - P.y);
      if (dist > 8) return {x: P.x, y: P.y};
      return GHOST_CORNER[3];
    }
  }
  return {x: P.x, y: P.y};
}

function chooseGhostDir(g) {
  const target = ghostTarget(g);
  const reverse = (g.dir + 2) % 4;
  let bestDist = Infinity, bestDir = g.dir;
  
  // Try each direction (in order: up, left, down, right — the classic priority)
  const tryOrder = [3, 2, 1, 0];
  
  for (const d of tryOrder) {
    if (d === reverse && g.mode !== 'eaten') continue; // can't reverse (unless eaten)
    const nx = wrapX(g.x + DX[d]);
    const ny = g.y + DY[d];
    if (!isWalkable(nx, ny, true, g.mode === 'eaten')) continue;
    // Don't let non-eaten ghosts go up in certain spots (classic no-up zones) - skip for simplicity
    const dist = (nx - target.x) ** 2 + (ny - target.y) ** 2;
    if (dist < bestDist) {
      bestDist = dist;
      bestDir = d;
    }
  }
  return bestDir;
}

function frightenedDir(g) {
  const reverse = (g.dir + 2) % 4;
  const options = [];
  for (let d = 0; d < 4; d++) {
    if (d === reverse) continue;
    const nx = wrapX(g.x + DX[d]);
    const ny = g.y + DY[d];
    if (isWalkable(nx, ny, true, false)) options.push(d);
  }
  if (options.length === 0) return reverse;
  return options[Math.floor(Math.random() * options.length)];
}

/* ===================== UPDATE ===================== */
function update(dt) {
  G.t += dt; G.stateT += dt;
  if (G.state === 'title') G.titleT += dt;
  if (G.msgT > 0) G.msgT -= dt;
  
  // Particles
  for (const p of G.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.life -= dt; }
  G.parts = G.parts.filter(p => p.life > 0);
  for (const p of G.pops) { p.t -= dt; p.y -= 24 * dt; }
  G.pops = G.pops.filter(p => p.t > 0);
  
  if (G.flashTimer > 0) G.flashTimer -= dt;
  
  if (G.state === 'over' && G.stateT > 1.2 && !G.entryHandled) { G.entryHandled = true; if (qualifies(G.score)) openEntry(); }
  if (G.state !== 'play') return;
  if (G.state === 'paused') return;
  
  // Ready timer
  if (G.readyTimer > 0) { G.readyTimer -= dt; return; }
  
  // Death animation
  if (G.deathTimer > 0) {
    G.deathTimer -= dt;
    if (G.deathTimer <= 0) afterDeath();
    return;
  }
  
  // Level complete
  if (G.levelCompleteTimer > 0) {
    G.levelCompleteTimer -= dt;
    if (G.levelCompleteTimer <= 0) nextLevel();
    return;
  }
  
  // Frightened timer
  if (G.frightTimer > 0) {
    G.frightTimer -= dt;
    G.frightFlash = G.frightTimer < 2 && Math.floor(G.t * 6) % 2 === 0;
    if (G.frightTimer <= 0) {
      G.frightTimer = 0;
      G.ghostEatCombo = 0;
      musicTempo = 1;
      for (const g of ghosts) {
        if (g.mode === 'frightened') g.mode = G.scatterMode ? 'scatter' : 'chase';
      }
      updateSpeeds();
    }
  }
  
  // Scatter/Chase timing
  if (G.frightTimer <= 0) {
    G.scatterTimer += dt;
    const phase = getScatterChaseTime(G.scatterPhase, G.level);
    if (G.scatterTimer >= phase.time && phase.time !== Infinity) {
      G.scatterTimer = 0;
      G.scatterPhase++;
      const next = getScatterChaseTime(G.scatterPhase, G.level);
      G.scatterMode = next.isScatter;
      // Reverse all ghost directions when mode changes
      for (const g of ghosts) {
        if (g.mode === 'scatter' || g.mode === 'chase') {
          g.mode = G.scatterMode ? 'scatter' : 'chase';
          g.dir = (g.dir + 2) % 4; // reverse
        }
      }
    }
  }
  
  // Fruit spawning
  if (!G.fruit && G.fruitsShown < 2) {
    if (G.dotsEaten === 70 || G.dotsEaten === 170) {
      G.fruit = { x: fruitPos.x, y: fruitPos.y, type: Math.min(G.level - 1, 4), timer: 10 };
      G.fruitsShown++;
      sfx.fruitAppear();
    }
  }
  if (G.fruit) {
    G.fruit.timer -= dt;
    if (G.fruit.timer <= 0) G.fruit = null;
  }
  
  // ---- Move player ----
  if (P.alive) {
    movePlayer(dt);
    
    // Eat dots
    const cx = Math.round(P.x), cy = Math.round(P.y);
    if (cx >= 0 && cx < COLS && cy >= 0 && cy < ROWS) {
      const dot = G.dots[cy][cx];
      if (dot === 1) {
        G.dots[cy][cx] = 0;
        G.dotsEaten++;
        addScore(10);
        G.wakaAlt = !G.wakaAlt;
        sfx.waka(G.wakaAlt);
        P.eatT = 0.12;
        // Particle
        const px = (cx + 0.5) * TILE, py = HUD + (cy + 0.5) * TILE;
        for (let i = 0; i < 4; i++) {
          const a = Math.random() * Math.PI * 2, s = 20 + Math.random() * 30;
          G.parts.push({ x: px, y: py, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.3, c: '#ffe0a0' });
        }
      } else if (dot === 2) {
        G.dots[cy][cx] = 0;
        G.dotsEaten++;
        addScore(50);
        sfx.powerPellet();
        G.frightTimer = 8;
        G.ghostEatCombo = 0;
        musicTempo = 1.4;
        // Frighten ghosts
        for (const g of ghosts) {
          if (g.mode === 'scatter' || g.mode === 'chase') {
            g.mode = 'frightened';
            g.dir = (g.dir + 2) % 4; // reverse
          }
        }
        updateSpeeds();
        // Bigger particle effect
        const px = (cx + 0.5) * TILE, py = HUD + (cy + 0.5) * TILE;
        for (let i = 0; i < 12; i++) {
          const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 60;
          G.parts.push({ x: px, y: py, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5, c: i % 2 ? '#ff4040' : '#ff8080' });
        }
      }
      
      // Check level complete
      if (G.dotsEaten >= G.dotCount) {
        G.levelCompleteTimer = 2.5;
        sfx.levelComplete();
        stopMusic();
        showMsg('LEVEL CLEAR!', 2);
        return;
      }
    }
    
    // Eat fruit
    if (G.fruit && Math.abs(P.x - G.fruit.x) < 1 && Math.abs(P.y - G.fruit.y) < 1) {
      const scores = [100, 300, 500, 700, 1000];
      const s = scores[G.fruit.type];
      addScore(s);
      const px = (G.fruit.x + 0.5) * TILE, py = HUD + (G.fruit.y + 0.5) * TILE;
      pop(px, py, '+' + s, '#ff6a6a');
      sfx.fruitCollect();
      G.fruit = null;
    }
    
    // Ghost collision
    for (const g of ghosts) {
      if (g.mode === 'house' || g.mode === 'leaving') continue;
      const dist = Math.abs(P.x - g.x) + Math.abs(P.y - g.y);
      if (dist < 0.8) {
        if (g.mode === 'frightened') {
          // Eat ghost
          g.mode = 'eaten';
          G.ghostEatCombo++;
          const pts = 200 * Math.pow(2, G.ghostEatCombo - 1);
          addScore(pts);
          const px = (g.x + 0.5) * TILE, py = HUD + (g.y + 0.5) * TILE;
          pop(px, py, '+' + pts, '#40e0ff');
          sfx.eatGhost();
          G.flashTimer = 0.1;
          buzz(35);
          updateSpeeds();
        } else if (g.mode !== 'eaten') {
          killPlayer();
          return;
        }
      }
    }
  }
  
  // ---- Move ghosts ----
  for (const g of ghosts) {
    if (g.mode === 'house') {
      g.houseTimer -= dt;
      // Bob up and down in house
      if (g.houseTimer <= 0) {
        g.mode = 'leaving';
      }
      continue;
    }
    
    if (g.mode === 'leaving') {
      // Move toward the door
      const doorX = ghostDoor.x;
      const doorY = ghostDoor.y - 1;
      const dx = doorX - g.x, dy = doorY - g.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 0.3) {
        g.x = doorX; g.y = doorY;
        g.mode = G.scatterMode ? 'scatter' : 'chase';
        g.dir = 3; // face up
        updateSpeeds();
      } else {
        const spd = 3 * dt;
        if (Math.abs(dx) > 0.1) g.x += Math.sign(dx) * Math.min(spd, Math.abs(dx));
        else if (Math.abs(dy) > 0.1) g.y += Math.sign(dy) * Math.min(spd, Math.abs(dy));
      }
      continue;
    }
    
    // Move ghost
    const speed = g.speed * dt;
    
    // Check if at intersection (integer position)
    const atTile = Math.abs(g.x - Math.round(g.x)) < 0.05 && Math.abs(g.y - Math.round(g.y)) < 0.05;
    
    if (atTile) {
      g.x = Math.round(g.x); g.y = Math.round(g.y);
      
      // Tunnel wrap
      g.x = wrapX(g.x);
      
      // Eaten ghost reaching house
      if (g.mode === 'eaten' && g.x === ghostDoor.x && g.y === ghostDoor.y) {
        g.mode = 'leaving';
        g.x = ghostHouse.x + 1;
        g.y = ghostHouse.y;
        g.houseTimer = 0;
        updateSpeeds();
        continue;
      }
      
      // Choose direction
      if (g.mode === 'frightened') {
        g.dir = frightenedDir(g);
      } else {
        g.dir = chooseGhostDir(g);
      }
      g.eyeDir = g.dir;
    }
    
    // Move in current direction
    const nx = g.x + DX[g.dir] * speed;
    const ny = g.y + DY[g.dir] * speed;
    
    // Check if next tile is walkable
    const nextTileX = Math.round(nx + DX[g.dir] * 0.5);
    const nextTileY = Math.round(ny + DY[g.dir] * 0.5);
    
    if (atTile && !isWalkable(wrapX(g.x + DX[g.dir]), g.y + DY[g.dir], true, g.mode === 'eaten')) {
      // Can't move forward, try other directions
      g.dir = chooseGhostDir(g);
    } else {
      g.x = nx; g.y = ny;
      // Tunnel wrap
      if (g.x < -1) g.x = COLS;
      if (g.x > COLS) g.x = -1;
    }
  }
}

function movePlayer(dt) {
  const speed = P.speed * dt;
  
  // Animate mouth
  P.mouthAngle += dt * 12;
  if (P.eatT > 0) P.eatT -= dt;
  
  const cx = Math.round(P.x), cy = Math.round(P.y);
  
  // Try queued direction first
  if (P.nextDir >= 0) {
    const ndx = DX[P.nextDir], ndy = DY[P.nextDir];
    const ntx = wrapX(cx + ndx), nty = cy + ndy;
    if (isWalkable(ntx, nty, false, false) && Math.abs(P.x - cx) < 0.3 && Math.abs(P.y - cy) < 0.3) {
      P.dir = P.nextDir;
      P.nextDir = -1;
      // Snap to grid
      P.x = cx; P.y = cy;
    }
  }
  
  // Move in current direction
  const dx = DX[P.dir], dy = DY[P.dir];
  let nx = P.x + dx * speed;
  let ny = P.y + dy * speed;
  
  // Check next tile
  const checkX = Math.round(nx + dx * 0.5);
  const checkY = Math.round(ny + dy * 0.5);
  
  if (isWalkable(wrapX(checkX), checkY, false, false)) {
    P.x = nx; P.y = ny;
  } else {
    // Stop at tile center
    P.x = Math.round(P.x);
    P.y = Math.round(P.y);
  }
  
  // Tunnel wrap
  if (P.x < -0.5) P.x = COLS - 0.5;
  if (P.x > COLS - 0.5) P.x = -0.5;
}

/* ===================== INPUT ===================== */
let entryOpen = false, lastTouch = 0;
function canvasPt(cx, cy) {
  const r = cv.getBoundingClientRect();
  return { x: (cx - r.left) / r.width * W, y: (cy - r.top) / r.height * H };
}

function padButtons() {
  if (!PADH) return [];
  const r = Math.min((PADH - 26) / 6.2, 58), cx = W / 2, cy = BASE_H + (PADH - 26) / 2 + 4;
  return [
    { d: 3, x: cx, y: cy - 2 * r, r },       // up
    { d: 1, x: cx, y: cy + 2 * r, r },        // down
    { d: 2, x: cx - 2.5 * r, y: cy, r },      // left
    { d: 0, x: cx + 2.5 * r, y: cy, r },      // right
  ];
}

function menuButtons() {
  const cy = HUD + MH / 2;
  const make = (labels, y) => {
    const bw = labels.length === 3 ? 118 : 150, gap = 12, tot = labels.length * bw + (labels.length - 1) * gap;
    return labels.map(([id, label, primary], i) => ({ id, label, primary, x: W / 2 - tot / 2 + i * (bw + gap), y, w: bw, h: 42 }));
  };
  if (G.state === 'paused') return make([['resume', 'RESUME', true], ['arcade', '\u25C0 ARCADE', false]], cy + 14);
  if (G.state === 'over' && G.stateT > 1.3 && G.entryHandled && !entryOpen)
    return make([['again', 'PLAY AGAIN', true], ['top', 'TOP 10', false], ['arcade', '\u25C0 ARCADE', false]], cy + 36);
  return [];
}

function menuAction(id) {
  audio();
  if (id === 'resume') togglePause();
  else if (id === 'again') startGame();
  else if (id === 'top') toTitle();
  else if (id === 'arcade') location.href = '/';
}

function setDir(d) {
  if (entryOpen) return;
  audio();
  if (G.state === 'title') { startGame(); return; }
  if (G.state === 'paused') { togglePause(); return; }
  if (G.state !== 'play') return;
  if (d === P.dir) return;
  P.nextDir = d;
}

function confirm() {
  if (entryOpen) return;
  audio();
  if (G.state === 'title') startGame();
  else if (G.state === 'paused') togglePause();
  else if (G.state === 'over') { if (G.stateT > 1.3 && G.entryHandled) startGame(); }
}

function tapAt(x, y) {
  if (entryOpen) return;
  audio();
  if (y < HUD) {
    if (x > W - 48) { if (G.state === 'play' || G.state === 'paused') togglePause(); return; }
    if (x > W - 96) { toggleMute(); return; }
    if (x > W - 140 && (G.state === 'play' || G.state === 'paused')) { goFull(); return; }
    if (x < 130 && (G.state === 'title')) { location.href = '/'; return; }
  }
  const mb = menuButtons().find(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
  if (mb) { menuAction(mb.id); return; }
  if (G.state === 'over') return;
  if (G.state === 'play') {
    // Determine swipe direction from player
    const px = (P.x + 0.5) * TILE, py = HUD + (P.y + 0.5) * TILE;
    const dx = x - px, dy = y - py;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 0 : 2);
    else setDir(dy > 0 ? 1 : 3);
    return;
  }
  confirm();
}

function toggleMute() {
  muted = !muted; lsSet(GAME_ID + '.muted', muted ? '1' : '0');
  if (muted) stopMusic();
  else if (G.state === 'play') startMusic();
}
function togglePause() {
  if (G.state === 'play') { G.state = 'paused'; stopMusic(); }
  else if (G.state === 'paused') { G.state = 'play'; startMusic(); }
}
function goFull() {
  const el = document.documentElement;
  if (document.fullscreenElement || !el.requestFullscreen) return;
  try { const p = el.requestFullscreen({ navigationUI: 'hide' }); if (p && p.catch) p.catch(() => {}); } catch (e) {}
}

cv.addEventListener('mousedown', e => {
  e.preventDefault();
  if (performance.now() - lastTouch < 800) return;
  const p = canvasPt(e.clientX, e.clientY); tapAt(p.x, p.y);
});
let touch = null;
cv.addEventListener('touchstart', e => {
  e.preventDefault(); lastTouch = performance.now();
  const t = e.changedTouches[0], p = canvasPt(t.clientX, t.clientY);
  if (G.state === 'play' || G.state === 'paused') {
    const b = padButtons().find(b => Math.hypot(p.x - b.x, p.y - b.y) <= b.r * 1.2);
    if (b) { G.padFlash = { d: b.d, t: 0.15 }; setDir(b.d); touch = null; return; }
  }
  touch = { id: t.identifier, x: p.x, y: p.y };
}, { passive: false });
cv.addEventListener('touchmove', e => { e.preventDefault(); }, { passive: false });
cv.addEventListener('touchend', e => {
  e.preventDefault(); lastTouch = performance.now();
  if (!touch) return;
  for (const t of e.changedTouches) if (t.identifier === touch.id) {
    const p = canvasPt(t.clientX, t.clientY), dx = p.x - touch.x, dy = p.y - touch.y;
    const start = touch; touch = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 22 && G.state === 'play') {
      setDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 0 : 2) : (dy > 0 ? 1 : 3));
    } else tapAt(start.x, start.y);
  }
}, { passive: false });

const KEYDIR = { ArrowUp: 3, ArrowDown: 1, ArrowLeft: 2, ArrowRight: 0, w: 3, s: 1, a: 2, d: 0, W: 3, S: 1, A: 2, D: 0 };
addEventListener('keydown', e => {
  if (entryOpen) return;
  if (KEYDIR[e.key] !== undefined) { e.preventDefault(); setDir(KEYDIR[e.key]); return; }
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!e.repeat) confirm(); return; }
  if (e.key === 'p' || e.key === 'P') togglePause();
  else if (e.key === 'm' || e.key === 'M') toggleMute();
  else if (e.key === 'Escape') {
    if (G.state === 'play' || G.state === 'paused') togglePause();
    else if (G.state === 'title') location.href = '/';
    else if (G.state === 'over' && G.entryHandled && G.stateT > 1.3) location.href = '/';
  }
});
addEventListener('blur', () => { if (G.state === 'play') togglePause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play') togglePause(); });
const sideways = matchMedia('(orientation: landscape) and (pointer: coarse) and (max-height: 520px)');
const onSideways = () => { if (sideways.matches && G.state === 'play') togglePause(); };
if (sideways.addEventListener) sideways.addEventListener('change', onSideways); else sideways.addListener(onSideways);

/* ===================== DRAWING HELPERS ===================== */
const UI_FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function circle(x, y, r, c) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = c; ctx.fill(); }
function text(s, x, y, size, color, align = 'center', weight = '700', spacing = 0) {
  ctx.font = `${weight} ${size}px ${UI_FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if ('letterSpacing' in ctx) ctx.letterSpacing = spacing + 'px';
  ctx.fillStyle = color; ctx.fillText(s, x, y);
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
}
function bigText(s, x, y, size, top = '#ffffff', bottom = '#ffd84a') {
  ctx.save();
  ctx.font = `900 ${size}px ${UI_FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = size * 0.4; ctx.shadowOffsetY = size * 0.08;
  const g = ctx.createLinearGradient(0, y - size / 2, 0, y + size / 2);
  g.addColorStop(0, top); g.addColorStop(1, bottom);
  ctx.fillStyle = g; ctx.fillText(s, x, y);
  ctx.shadowColor = 'transparent';
  ctx.lineWidth = Math.max(1, size / 28); ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.strokeText(s, x, y);
  ctx.restore();
}
function panel(x, y, w, h) {
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.65)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 8;
  rr(x, y, w, h, 18);
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(50,22,5,.93)'); g.addColorStop(1, 'rgba(15,6,2,.95)');
  ctx.fillStyle = g; ctx.fill(); ctx.restore();
  ctx.save(); rr(x, y, w, h, 18); ctx.clip();
  const g2 = ctx.createLinearGradient(0, y, 0, y + 70);
  g2.addColorStop(0, 'rgba(255,200,100,.09)'); g2.addColorStop(1, 'rgba(255,200,100,0)');
  ctx.fillStyle = g2; ctx.fillRect(x, y, w, 70); ctx.restore();
  rr(x, y, w, h, 18); ctx.strokeStyle = 'rgba(255,180,80,.38)'; ctx.lineWidth = 1.5; ctx.stroke();
}
function glassButton(x, y, w, h, active = false) {
  rr(x, y, w, h, h / 2);
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  if (active) { g.addColorStop(0, 'rgba(255,200,80,.45)'); g.addColorStop(1, 'rgba(200,120,30,.35)'); }
  else { g.addColorStop(0, 'rgba(255,255,255,.14)'); g.addColorStop(1, 'rgba(255,255,255,.04)'); }
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(255,200,100,.45)'; ctx.lineWidth = 1.5; ctx.stroke();

function iconSpeaker(cx, cy, off) {
  ctx.fillStyle = off ? '#8a7a6a' : '#ffffff';
  ctx.beginPath(); ctx.moveTo(cx - 8, cy - 3.5); ctx.lineTo(cx - 4, cy - 3.5); ctx.lineTo(cx + 1, cy - 8); ctx.lineTo(cx + 1, cy + 8); ctx.lineTo(cx - 4, cy + 3.5); ctx.lineTo(cx - 8, cy + 3.5); ctx.closePath(); ctx.fill();

  else { ctx.beginPath(); ctx.arc(cx + 2, cy, 5, -0.8, 0.8); ctx.stroke(); ctx.beginPath(); ctx.arc(cx + 2, cy, 9, -0.8, 0.8); ctx.stroke(); }

/* ===================== DRAW MAZE ===================== */
let mazeCanvas = null, mazeDpr = 0, mazeLevel = -1;

function buildMazeCanvas() {
  if (mazeDpr === dpr && mazeLevel === G.level && mazeCanvas) return;
  mazeDpr = dpr; mazeLevel = G.level;
  mazeCanvas = document.createElement('canvas');
  mazeCanvas.width = Math.round(MW * dpr);
  mazeCanvas.height = Math.round(MH * dpr);
  const mc = mazeCanvas.getContext('2d');
  mc.setTransform(dpr, 0, 0, dpr, 0, 0);
  
  // Draw walls
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (G.maze[y][x] !== 1) continue;
      
      const px = x * TILE, py = y * TILE;
      
      // Warm diner wall colors
      const wallColors = [
        ['#8B4513', '#A0522D', '#CD853F'], // Brown/sienna
        ['#B22222', '#CD5C5C', '#E8967A'], // Red
        ['#D2691E', '#E87A3C', '#F4A460'], // Chocolate/orange
      ];
      const ci = G.mazeIdx % wallColors.length;
      
      // Check which sides are exposed (adjacent to path)
      const hasPath = (nx, ny) => {
        if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) return false;
        return G.maze[ny][nx] === 0 || G.maze[ny][nx] === 2 || G.maze[ny][nx] === 3;
      };
      
      const top = hasPath(x, y - 1);
      const bottom = hasPath(x, y + 1);
      const left = hasPath(x - 1, y);
      const right = hasPath(x + 1, y);
      
      // Fill base wall
      mc.fillStyle = wallColors[ci][0];
      mc.fillRect(px, py, TILE, TILE);
      
      // Draw edges with lighter color
      mc.lineWidth = 2.5;
      mc.lineCap = 'round';
      mc.strokeStyle = wallColors[ci][2];
      
      if (top) {
        mc.beginPath(); mc.moveTo(px + 1, py + 1.5); mc.lineTo(px + TILE - 1, py + 1.5); mc.stroke();
      }
      if (bottom) {
        mc.beginPath(); mc.moveTo(px + 1, py + TILE - 1.5); mc.lineTo(px + TILE - 1, py + TILE - 1.5); mc.stroke();
      }
      if (left) {
        mc.beginPath(); mc.moveTo(px + 1.5, py + 1); mc.lineTo(px + 1.5, py + TILE - 1); mc.stroke();
      }
      if (right) {
        mc.beginPath(); mc.moveTo(px + TILE - 1.5, py + 1); mc.lineTo(px + TILE - 1.5, py + TILE - 1); mc.stroke();
      }
      
      // Add subtle texture
      mc.fillStyle = 'rgba(255,220,180,.06)';
      if ((x + y) % 2 === 0) mc.fillRect(px, py, TILE, TILE);
    }
  }
  
  // Draw ghost door
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (G.maze[y][x] === 2) {
        mc.fillStyle = '#ff9a9a';
        mc.fillRect(x * TILE + 1, y * TILE + TILE / 2 - 2, TILE - 2, 4);
      }
    }
  }
}

function drawMaze() {
  buildMazeCanvas();
  ctx.drawImage(mazeCanvas, 0, HUD, MW, MH);
  
  // Draw dots
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const dot = G.dots[y][x];
      if (dot === 0) continue;
      const px = x * TILE + TILE / 2, py = HUD + y * TILE + TILE / 2;
      if (dot === 1) {
        // Small ingredient dot
        circle(px, py, 2, '#ffe4a0');
        // Subtle glow
        ctx.beginPath(); ctx.arc(px, py, 3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,228,160,.15)'; ctx.fill();
      } else if (dot === 2) {
        // Power pellet - hot sauce bottle
        const pulse = 1 + Math.sin(G.t * 6) * 0.2;
        // Glow
        ctx.beginPath(); ctx.arc(px, py, 8 * pulse, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,60,40,.2)'; ctx.fill();
        // Bottle body
        ctx.fillStyle = '#e02020';
        rr(px - 3, py - 4, 6, 8, 2); ctx.fill();
        // Cap
        ctx.fillStyle = '#40a040';
        rr(px - 2, py - 6, 4, 3, 1); ctx.fill();
        // Label
        ctx.fillStyle = '#ffcc00';
        ctx.fillRect(px - 2, py - 1, 4, 3);
      }
    }
  }
  
  // Draw fruit
  if (G.fruit) {
    const fx = G.fruit.x * TILE + TILE / 2, fy = HUD + G.fruit.y * TILE + TILE / 2;
    const bob = Math.sin(G.t * 4) * 2;
    ctx.save(); ctx.translate(fx, fy + bob);
    drawFruit(G.fruit.type, 0, 0);
    ctx.restore();
  }
}

function drawFruit(type, x, y) {
  // 0=cherries, 1=fries, 2=milkshake, 3=burger, 4=pie slice
  ctx.save(); ctx.translate(x, y);
  ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,220,140,.12)'; ctx.fill();
  const g = (x0, y0, x1, y1, a, b) => { const gr = ctx.createLinearGradient(x0, y0, x1, y1); gr.addColorStop(0, a); gr.addColorStop(1, b); return gr; };
  switch (type) {
    case 0: { // cherries
      ctx.strokeStyle = '#2f7a1a'; ctx.lineWidth = 1.2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-3, 1); ctx.quadraticCurveTo(-1, -5, 2, -7); ctx.moveTo(3, 2); ctx.quadraticCurveTo(3, -4, 2, -7); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(4, -7, 2.6, 1.2, -0.4, 0, Math.PI * 2); ctx.fillStyle = '#4cae2a'; ctx.fill();
      for (const [cx, cy] of [[-3, 3], [3, 4]]) {
        const rg = ctx.createRadialGradient(cx - 1.2, cy - 1.2, 0.3, cx, cy, 4); rg.addColorStop(0, '#ff8a8a'); rg.addColorStop(0.5, '#d01020'); rg.addColorStop(1, '#6a0008');
        ctx.beginPath(); ctx.arc(cx, cy, 3.6, 0, Math.PI * 2); ctx.fillStyle = rg; ctx.fill();
        circle(cx - 1.2, cy - 1.3, 0.8, 'rgba(255,255,255,.75)');
      }
      break;
    }
    case 1: { // fries
      const fx = [[-4, -6], [-2, -8], [0, -5], [2, -7], [4, -6], [-1, -3], [3, -4]];
      for (const [fx0, fy0] of fx) { ctx.fillStyle = g(0, fy0, 0, 2, '#fff2a0', '#e0a020'); rr(fx0 - 0.9, fy0, 1.8, 8, 0.6); ctx.fill(); }
      ctx.beginPath(); ctx.moveTo(-6, -1); ctx.lineTo(6, -1); ctx.lineTo(4.5, 7); ctx.lineTo(-4.5, 7); ctx.closePath();
      ctx.fillStyle = g(-6, 0, 6, 0, '#a01818', '#ff4a3a'); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillRect(-5, 1, 10, 1.2);
      circle(0, 4, 1.4, '#ffd84a');
      break;
    }
    case 2: { // milkshake
      ctx.strokeStyle = '#ff5a8a'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(1, -4); ctx.lineTo(4, -9); ctx.stroke();
      circle(-2, -4, 3, '#ffffff'); circle(2, -4.5, 3, '#ffffff'); circle(0, -6, 2.6, '#ffffff');
      circle(0, -8.4, 1.6, '#d01020'); circle(-0.5, -8.9, 0.5, 'rgba(255,255,255,.8)');
      ctx.beginPath(); ctx.moveTo(-4.5, -2); ctx.lineTo(4.5, -2); ctx.lineTo(2.6, 6); ctx.lineTo(-2.6, 6); ctx.closePath();
      ctx.fillStyle = g(-4, 0, 4, 0, '#ff8ab8', '#ffd0e4'); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(-3, -1, 1, 6);
      ctx.fillStyle = '#c8ccd8'; rr(-3.5, 6, 7, 1.6, 0.8); ctx.fill(); ctx.fillRect(-0.6, 5, 1.2, 2);
      break;
    }
    case 3: { // burger
      ctx.beginPath(); ctx.ellipse(0, -3, 6.5, 4, 0, Math.PI, 0); ctx.closePath(); ctx.fillStyle = g(0, -7, 0, -3, '#f7c160', '#c8792a'); ctx.fill();
      for (const [sx, sy] of [[-3, -5], [0, -6], [3, -5]]) { ctx.beginPath(); ctx.ellipse(sx, sy, 0.9, 0.45, 0.3, 0, Math.PI * 2); ctx.fillStyle = '#fff6dc'; ctx.fill(); }
      ctx.beginPath(); ctx.moveTo(-7, -2.6);
      for (let i = 0; i <= 7; i++) ctx.lineTo(-7 + i * 2, -2.6 + (i % 2 ? 1.6 : 0));
      ctx.lineTo(7, -1); ctx.lineTo(-7, -1); ctx.closePath(); ctx.fillStyle = '#4dcc40'; ctx.fill();
      ctx.beginPath(); ctx.moveTo(-6.5, -1); ctx.lineTo(6.5, -1); ctx.lineTo(4, 1.6); ctx.lineTo(-4, 1.6); ctx.closePath(); ctx.fillStyle = '#ffd030'; ctx.fill();
      rr(-6.5, 0.6, 13, 3, 1.5); ctx.fillStyle = '#6a3014'; ctx.fill();
      ctx.beginPath(); ctx.ellipse(0, 4, 6.3, 2.4, 0, 0, Math.PI); ctx.fillStyle = '#d8913a'; ctx.fill(); ctx.fillRect(-6.3, 3.4, 12.6, 1);
      break;
    }
    default: { // pie slice
      ctx.beginPath(); ctx.moveTo(-7, 5); ctx.lineTo(7, 5); ctx.lineTo(0, -7); ctx.closePath();
      ctx.fillStyle = g(0, -7, 0, 5, '#e8a040', '#b8701e'); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-6, 5); ctx.lineTo(6, 5); ctx.lineTo(6, 2.6); ctx.lineTo(-6, 2.6); ctx.closePath(); ctx.fillStyle = '#c8203a'; ctx.fill();
      rr(-7.5, 4.2, 15, 2.6, 1.3); ctx.fillStyle = '#d8913a'; ctx.fill();
      ctx.strokeStyle = 'rgba(120,60,10,.6)'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.moveTo(-2, -1); ctx.lineTo(2, -1); ctx.moveTo(-3.5, 1.5); ctx.lineTo(3.5, 1.5); ctx.stroke();
      circle(0, -7.4, 1.6, '#ffffff'); circle(0.4, -8.4, 0.8, '#d01020');
    }
  }
  ctx.restore();
}

/* ===================== DRAW CHEF (PLAYER) ===================== */
function pieBody(r, mouth) {
  // golden lattice pie with a cherry-filled mouth, drawn facing right
  const a0 = mouth * 0.42, a1 = Math.PI * 2 - mouth * 0.42;
  ctx.beginPath(); ctx.arc(0, 0, r, a0, a1); ctx.lineTo(0, 0); ctx.closePath();
  const rg = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r * 1.05);
  rg.addColorStop(0, '#ffe2a0'); rg.addColorStop(0.55, '#f0a948'); rg.addColorStop(1, '#a8601a');
  ctx.fillStyle = rg; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = 'rgba(150,80,20,.55)'; ctx.lineWidth = 1.3;
  ctx.beginPath();
  for (let k = -2; k <= 2; k++) { ctx.moveTo(-r, k * 3.4 - r); ctx.lineTo(r, k * 3.4 + r); ctx.moveTo(-r, k * 3.4 + r); ctx.lineTo(r, k * 3.4 - r); }
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.ellipse(-r * 0.3, -r * 0.45, r * 0.45, r * 0.22, -0.4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // cherry filling showing in the mouth
  if (mouth > 0.05) {
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r * 0.82, -a0, a0); ctx.closePath();
    ctx.fillStyle = '#7a0e1a'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a0) * r, Math.sin(a0) * r); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a1) * r, Math.sin(a1) * r);
    ctx.strokeStyle = '#d0203a'; ctx.lineWidth = 1.6; ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(0, 0, r, a0, a1); ctx.strokeStyle = '#8a4a10'; ctx.lineWidth = 0.9; ctx.stroke();
}
function drawChef() {
  if (!P.alive) return;
  const px = (P.x + 0.5) * TILE, py = HUD + (P.y + 0.5) * TILE;
  const mouth = Math.abs(Math.sin(P.mouthAngle)) * 0.85;
  const bite = P.eatT > 0 ? 1 + P.eatT * 1.1 : 1;
  const r = 7.2;
  ctx.save(); ctx.translate(px, py); ctx.scale(bite, bite);
  ctx.beginPath(); ctx.ellipse(0.6, r + 0.8, r * 0.8, 1.6, 0, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fill();
  ctx.save();
  if (P.dir === 2) ctx.scale(-1, 1); else ctx.rotate(P.dir * Math.PI / 2);
  pieBody(r, mouth);
  ctx.restore();
  // eye + brow stay upright and look where the pie is heading
  const ex = P.dir === 0 ? 1.5 : P.dir === 2 ? -1.5 : 0, ey = P.dir === 1 ? -1 : -3.4;
  const blink = (G.t % 3.2) < 0.12;
  if (blink) { ctx.strokeStyle = '#2a1404'; ctx.lineWidth = 1.1; ctx.beginPath(); ctx.moveTo(ex - 1.8, ey); ctx.lineTo(ex + 1.8, ey); ctx.stroke(); }
  else {
    circle(ex, ey, 2.2, '#ffffff'); circle(ex + DX[P.dir] * 0.7, ey + DY[P.dir] * 0.7, 1.3, '#1a1006'); circle(ex + DX[P.dir] * 0.7 + 0.4, ey + DY[P.dir] * 0.7 - 0.5, 0.45, '#fff');
  }
  ctx.strokeStyle = '#5a2a06'; ctx.lineWidth = 1; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(ex - 2.4, ey - 3); ctx.quadraticCurveTo(ex, ey - 4.2 - (P.eatT > 0 ? 0.8 : 0), ex + 2.4, ey - 3.2); ctx.stroke();
  // chef's toque, tilted a little with travel direction
  ctx.save(); ctx.translate(DX[P.dir] * -0.8, -r - 1); ctx.rotate(DX[P.dir] * -0.18 + Math.sin(G.t * 5) * 0.04);
  ctx.fillStyle = '#ffffff'; rr(-4.6, -2, 9.2, 3.4, 1.2); ctx.fill();
  ctx.fillStyle = '#d8dce6'; ctx.fillRect(-4.6, 0.6, 9.2, 0.8);
  for (const [cx, cy, rr_] of [[-2.8, -3.6, 2.9], [2.8, -3.6, 2.9], [0, -5.4, 3.3]]) {

/* ===================== DRAW DEATH ANIMATION ===================== */
function drawDeathAnim() {
  if (P.alive || G.deathTimer <= 0) return;
  
  const px = (P.x + 0.5) * TILE, py = HUD + (P.y + 0.5) * TILE;
  const progress = 1 - G.deathTimer / 2.0; // 0 to 1

  ctx.restore();
}

/* ===================== DRAW GHOSTS (PESTS) ===================== */
function ghostLook(g) {
  const gx = g.x, gy = g.y, dx = P.x - gx, dy = P.y - gy, d = Math.hypot(dx, dy) || 1;
  return [dx / d, dy / d];
}
function ghostShape(r, wob) {
  ctx.beginPath();
  ctx.moveTo(-r, 1);
  ctx.bezierCurveTo(-r, -r - 2.5, r, -r - 2.5, r, 1);
  ctx.lineTo(r, r - 1.5);
  const n = 4, step = (r * 2) / n;
  for (let i = 0; i < n; i++) {
    const x0 = r - i * step, xm = x0 - step / 2, x1 = x0 - step;
    const dip = r + 1.6 + Math.sin(wob + i * 1.7) * 1.4;
    ctx.quadraticCurveTo(xm + Math.sin(wob + i) * 0.8, dip, x1, r - 1.5 + Math.cos(wob * 1.3 + i) * 0.6);
  }
  ctx.closePath();
}
function drawGhost(g) {
  const px = (g.x + 0.5) * TILE, py = HUD + (g.y + 0.5) * TILE;
  const r = 7;
  ctx.save(); ctx.translate(px, py);
  if (g.mode === 'eaten') { drawGhostEyes(g, 0, 0); ctx.restore(); return; }
  const scared = g.mode === 'frightened';
  const bob = Math.sin(G.t * 5 + g.idx * 1.3) * 0.7;
  ctx.translate(0, bob);
  const wob = G.t * 9 + g.idx;
  const base = scared ? (G.frightFlash ? '#f4f6ff' : '#2a3cff') : GHOST_COLORS[g.idx];
  // shadow on the floor
  ctx.beginPath(); ctx.ellipse(0, r + 2.4 - bob, r * 0.75, 1.5, 0, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fill();
  // pest-specific bits that sit behind the body
  if (!scared && g.idx === 2) {
    ctx.globalAlpha = 0.45 + Math.sin(G.t * 30) * 0.2;
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(s * 6.5, -4, 3.8, 6, s * 0.5 + Math.sin(G.t * 30) * 0.25 * s, 0, Math.PI * 2); ctx.fillStyle = '#cfeaff'; ctx.fill(); ctx.strokeStyle = 'rgba(120,180,220,.8)'; ctx.lineWidth = 0.5; ctx.stroke(); }
    ctx.globalAlpha = 1;
  }
  if (!scared && g.idx === 1) {
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.ellipse(s * 5, -r + 1, 3, 4, s * 0.3, 0, Math.PI * 2); ctx.fillStyle = GHOST_COLORS[1]; ctx.fill();
      ctx.beginPath(); ctx.ellipse(s * 5, -r + 1, 1.5, 2.5, s * 0.3, 0, Math.PI * 2); ctx.fillStyle = '#ff8888'; ctx.fill();
    }
  }
  // body
  ghostShape(r, wob);
  const bg = ctx.createRadialGradient(-2.5, -4, 0.5, 0, 0, r * 1.5);
  bg.addColorStop(0, '#ffffff'); bg.addColorStop(0.18, base); bg.addColorStop(1, scared && !G.frightFlash ? '#0a1260' : 'rgba(0,0,0,.55)');
  ctx.fillStyle = base; ctx.fill(); ctx.fillStyle = bg; ctx.globalAlpha = 0.55; ctx.fill(); ctx.globalAlpha = 1;
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 0.8; ctx.stroke();
  if (scared) {
    const fc = G.frightFlash ? '#ff3030' : '#ffd0d0';
    circle(-2.6, -2, 1.4, fc); circle(2.6, -2, 1.4, fc);
    ctx.strokeStyle = fc; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-4.5, 3);
    for (let i = 1; i <= 6; i++) ctx.lineTo(-4.5 + i * 1.5, 3 + (i % 2 ? -1.2 : 0.4) + Math.sin(G.t * 20) * 0.3);
    ctx.stroke();
    // nervous sweat drop
    ctx.beginPath(); ctx.ellipse(r - 1, -r + 1 + (G.t * 6 % 4), 0.9, 1.4, 0, 0, Math.PI * 2); ctx.fillStyle = 'rgba(180,220,255,.9)'; ctx.fill();
  } else {
    drawGhostEyes(g, 0, 0);
    ctx.lineCap = 'round';
    if (g.idx === 0 || g.idx === 3) {
      const col = g.idx === 0 ? '#8a2a1a' : '#a8501a';
      ctx.strokeStyle = col; ctx.lineWidth = 1.1;
      const sw = Math.sin(G.t * 8 + g.idx) * 1.2;
      ctx.beginPath(); ctx.moveTo(-2, -r + 0.5); ctx.quadraticCurveTo(-4, -r - 4, -6 + sw, -r - 4); ctx.moveTo(2, -r + 0.5); ctx.quadraticCurveTo(4, -r - 4, 6 - sw, -r - 4); ctx.stroke();
      circle(-6 + sw, -r - 4, 1, '#ffcc00'); circle(6 - sw, -r - 4, 1, '#ffcc00');
      if (g.idx === 3) {
        ctx.strokeStyle = col; ctx.lineWidth = 0.9;
        const st = Math.sin(G.t * 14) * 1.2;
        ctx.beginPath(); ctx.moveTo(-r, 0); ctx.lineTo(-r - 3, -2 + st); ctx.moveTo(-r, 3); ctx.lineTo(-r - 3, 4 - st); ctx.moveTo(r, 0); ctx.lineTo(r + 3, -2 - st); ctx.moveTo(r, 3); ctx.lineTo(r + 3, 4 + st); ctx.stroke();
      } else {
        ctx.fillStyle = 'rgba(80,20,10,.35)'; ctx.fillRect(-0.4, 1, 0.8, 4);
      }
    }
    if (g.idx === 1) {
      ctx.strokeStyle = '#fff0e8'; ctx.lineWidth = 0.5;
      ctx.beginPath(); ctx.moveTo(-3, 1.5); ctx.lineTo(-8, 0); ctx.moveTo(-3, 2.5); ctx.lineTo(-8, 3.5); ctx.moveTo(3, 1.5); ctx.lineTo(8, 0); ctx.moveTo(3, 2.5); ctx.lineTo(8, 3.5); ctx.stroke();
      circle(0, 1.6, 1, '#ff6a8a');
    }
  }
  ctx.restore();
}

function drawGhostEyes(g, ox, oy) {
  const [lx, ly] = typeof g === 'number' ? [DX[g], DY[g]] : g.mode === 'eaten' ? [DX[g.eyeDir], DY[g.eyeDir]] : ghostLook(g);
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.ellipse(ox + s * 3, oy - 2.2, 2.4, 3, 0, 0, Math.PI * 2); ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 0.5; ctx.stroke();
    circle(ox + s * 3 + lx * 1.1, oy - 2.2 + ly * 1.4, 1.35, '#1a2ad0');
    circle(ox + s * 3 + lx * 1.1 - 0.4, oy - 2.2 + ly * 1.4 - 0.5, 0.45, '#ffffff');
  }
}

/* ===================== DRAW D-PAD ===================== */
function drawPad() {
  if (!PADH) return;
  const y0 = BASE_H;
  const g = ctx.createLinearGradient(0, y0, 0, H);
  g.addColorStop(0, '#0a0500'); g.addColorStop(1, '#050200');
  ctx.fillStyle = g; ctx.fillRect(0, y0, W, PADH);
  
  const active = G.state === 'play' || G.state === 'paused';
  const dirNames = ['▶', '▼', '◀', '▲'];
  for (const b of padButtons()) {
    const lit = G.padFlash && G.padFlash.d === b.d;
    ctx.globalAlpha = active ? 1 : 0.35;
    ctx.save(); ctx.shadowColor = lit ? 'rgba(255,180,60,.8)' : 'rgba(0,0,0,.6)'; ctx.shadowBlur = lit ? 24 : 14;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    const rg = ctx.createRadialGradient(b.x, b.y - b.r * 0.4, 2, b.x, b.y, b.r * 1.3);

    else { rg.addColorStop(0, '#3a2a15'); rg.addColorStop(1, '#1a0d05'); }
    ctx.fillStyle = rg; ctx.fill(); ctx.restore();
    ctx.strokeStyle = 'rgba(255,180,80,.55)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
    ctx.save(); ctx.translate(b.x, b.y);
    const rot = [0, Math.PI / 2, Math.PI, -Math.PI / 2][b.d];
    ctx.rotate(rot);
    ctx.strokeStyle = '#fff3e0'; ctx.lineWidth = b.r * 0.16; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(b.r * 0.14, b.r * 0.2); ctx.lineTo(b.r * 0.32, 0); ctx.lineTo(b.r * 0.14, -b.r * 0.2); ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 1;
  }
  text('SWIPE OR USE D-PAD TO MOVE', W / 2, H - 12, 10.5, '#6a5030', 'center', '700', 1);
}

/* ===================== MAIN DRAW ===================== */
function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  
  // Background
  ctx.fillStyle = '#0a0500';
  ctx.fillRect(0, HUD, MW, MH);
  
  if (G.state === 'title') {
    drawTitle();
  } else {
    // Maze
    ctx.save();
    ctx.beginPath(); ctx.rect(0, HUD, MW, MH); ctx.clip();
    drawMaze();
    
    // Draw ghosts
    for (const g of ghosts) drawGhost(g);
    
    // Draw player
    if (G.deathTimer > 0) drawDeathAnim();
    else drawChef();
    
    // Particles
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const p of G.parts) { ctx.globalAlpha = clamp(p.life * 2, 0, 1); circle(p.x, p.y, 2.6, p.c); }
    ctx.restore();
    
    // Pop-up scores
    for (const p of G.pops) {
      ctx.save(); ctx.globalAlpha = clamp(p.t * 2, 0, 1); ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 6;
      text(p.txt, p.x, p.y, 12, p.color, 'center', '900'); ctx.restore();
    }
    
    ctx.restore();
    
    drawOverlays();
  }
  
  drawHUD();
  drawBar();
  drawPad();
}

  const name = iniIn.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 3);
  if (!name) { iniMsg.textContent = 'Enter 1 to 3 letters or numbers.'; return; }
  lsSet(GAME_ID + '.initials', name);
  iniSave.disabled = true; iniMsg.textContent = '';
  const res = await submitScore(name, G.score, G.level);
  if (res === true) closeEntry(); else { iniMsg.textContent = res; iniSave.disabled = false; }
});
iniSkip.addEventListener('click', closeEntry);

/* ===================== GAME LOOP ===================== */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
