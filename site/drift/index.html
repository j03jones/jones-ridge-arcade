<style>
  html,body { margin:0; position:fixed; inset:0; height:100%; background:#0b0f1e; color:#f4f0ff; overflow:hidden; overscroll-behavior:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; touch-action:none; -webkit-user-select:none; user-select:none; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; box-sizing:border-box;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  canvas { display:block; background:#0b0f1e; box-shadow:0 0 40px rgba(255,60,170,.22); }
  #ini { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,4,12,.6); z-index:5; }
  #ini[hidden] { display:none; }
  #ini form { background:linear-gradient(rgba(40,14,60,.95),rgba(12,8,30,.96)); border:2px solid #ff4fb0; border-radius:20px; padding:24px 26px;
    text-align:center; width:min(86vw,360px); box-sizing:border-box; box-shadow:0 0 40px rgba(255,79,176,.45); color:#f4f0ff; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  #ini .t { font:900 26px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; color:#ffd84a; }
  #ini .s { font-weight:800; font-size:17px; margin:6px 0 16px; }
  #ini label { display:block; font-weight:800; font-size:13px; letter-spacing:.08em; color:#ffb0e0; margin-bottom:8px; }
  #ini input { width:4.6em; font:bold 40px "Courier New", monospace; text-align:center; letter-spacing:.3em; padding:6px 0 6px .3em;
    text-transform:uppercase; background:#000; color:#fff; border:2px solid #ffb0e0; border-radius:10px; -webkit-user-select:text; user-select:text; }
  #ini .row { display:flex; gap:10px; justify-content:center; margin-top:16px; }
  #ini button { font:800 17px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; padding:11px 20px; border-radius:22px; border:2px solid #ffb0e0; background:#b0237a; color:#fff; cursor:pointer; }
  #ini button.alt { background:transparent; color:#ffb0e0; }

<body>
<div id="rotate" aria-live="polite"><style>
  #rotate { display:none; position:fixed; inset:0; z-index:100; background:#0b0f1e; color:#f4f0ff; align-items:center; justify-content:center;
    flex-direction:column; gap:18px; text-align:center; font:800 18px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; letter-spacing:.08em; }
  #rotate .ph { width:38px; height:64px; border:4px solid #ff4fb0; border-radius:9px; box-shadow:0 0 16px rgba(255,79,176,.6); animation:jrTurn 2s ease-in-out infinite; }
  #rotate small { display:block; margin-top:6px; font-weight:600; font-size:13px; color:#b8a6d6; letter-spacing:.04em; }
  @keyframes jrTurn { 0%,25% { transform:rotate(-90deg); } 60%,100% { transform:rotate(0); } }
  @media (orientation:landscape) and (pointer:coarse) and (max-height:520px) { #rotate { display:flex; } }
</style><div class="ph"></div><div>TURN YOUR PHONE UPRIGHT<small>This game plays in portrait</small></div></div>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="ini" hidden>
  <form autocomplete="off">
    <div class="t">NEW HIGH SCORE!</div>
    <div class="s" id="iniScore"></div>
    <label for="iniIn">ENTER YOUR INITIALS</label>
    <input id="iniIn" maxlength="3" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="done">
    <div class="row"><button type="submit" id="iniSave">SAVE</button><button type="button" class="alt" id="iniSkip">SKIP</button></div>
    <div class="m" id="iniMsg"></div>
  </form>
</div>
<script>
(() => {
'use strict';
/* =====================================================================
   TURBO DRIFT — a top-down night-time delivery driving game for the
   Jones Ridge Arcade. Slide the diner's hot-rod through winding back
   roads and drop off orders before the food goes cold.
   All graphics are drawn in code, all sounds synthesized.
   ===================================================================== */
const GAME_ID = 'drift';
const W = 480, HUD = 58;
const ROADW = 240, LANE = 80, WALL = ROADW / 2 + 58;
const SEG = 420;
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const UI_FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const wrap = document.getElementById('wrap');
let H = 760, dpr = 1;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
function hash(n) { let x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function fit() {
  const aw = wrap.clientWidth || innerWidth, ah = wrap.clientHeight || innerHeight;
  let h = Math.round(clamp(W * ah / aw, 680, 1000));
  if (!IS_TOUCH) h = Math.min(h, 860);
  H = h;
  dpr = Math.max(1, Math.min(3, Math.ceil(Math.min(aw / W, ah / H) * (window.devicePixelRatio || 1) * 4) / 4));
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const k = Math.min(aw / W, ah / H);
  cv.style.width = Math.floor(W * k) + 'px'; cv.style.height = Math.floor(H * k) + 'px';
}
addEventListener('resize', fit);
if (window.visualViewport) visualViewport.addEventListener('resize', fit);

/* ---- storage + leaderboards ---- */
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
let BOARD = [], WEEK = null, BOARD_SHARED = false, MINE = null;
function loadLocal() { try { const l = JSON.parse(lsGet(GAME_ID + '.top10', '[]')); return Array.isArray(l) ? l : []; } catch (e) { return []; } }
function insertLocal(entry) {
  const l = loadLocal(); l.push(entry); l.sort((a, b) => b.score - a.score);
  const top = l.slice(0, 10); lsSet(GAME_ID + '.top10', JSON.stringify(top)); return { top, rank: top.indexOf(entry) + 1 };
}
async function getJSON(url) { const r = await fetch(url, { cache: 'no-store' }); if (!r.ok) throw new Error(String(r.status)); const d = await r.json(); if (!Array.isArray(d)) throw new Error('bad'); return d; }
async function refreshBoard() {
  try {
    const [all, week] = await Promise.all([getJSON('/api/scores/' + GAME_ID), getJSON('/api/scores/' + GAME_ID + '?board=week').catch(() => null)]);
    BOARD = all; WEEK = week; BOARD_SHARED = true;
  } catch (e) { if (!BOARD_SHARED) { BOARD = loadLocal(); WEEK = null; } }
}
const beats = (list, score) => list.length < 10 || score > list[list.length - 1].score;
function qualifies(score) { return score > 0 && (beats(BOARD, score) || (WEEK !== null && beats(WEEK, score))); }
async function submitScore(name, score, level) {
  const local = insertLocal({ name, score, level, date: new Date().toISOString().slice(0, 10) });
  if (!BOARD_SHARED) { BOARD = local.top; MINE = { name, score, rank: { all: local.rank, week: 0 } }; return true; }
  try {
    const r = await fetch('/api/scores/' + GAME_ID + '?v=2', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, score, level }) });
    if (r.ok) {
      const d = await r.json();
      if (d && Array.isArray(d.all)) { BOARD = d.all; WEEK = Array.isArray(d.week) ? d.week : WEEK; MINE = { name, score, rank: d.rank || { all: 0, week: 0 } }; }
      else if (Array.isArray(d)) { BOARD = d; MINE = { name, score, rank: { all: d.findIndex(e => e.name === name && e.score === score) + 1, week: 0 } }; }
      return true;
    }
    return r.status === 429 ? 'Too many scores from this connection. Try again in a few minutes.' : 'Could not save to the scoreboard (error ' + r.status + ').';
  } catch (e) { return 'Could not reach the scoreboard. Check your connection.'; }
}
function rankLine() {
  if (!MINE || !MINE.rank) return '';
  const { all, week } = MINE.rank;
  if (all) return 'YOU\'RE #' + all + (BOARD_SHARED ? ' ALL-TIME!' : ' ON THIS DEVICE!') + (week === 1 && all !== 1 ? '  ·  #1 THIS WEEK' : '');
  if (week) return 'YOU\'RE #' + week + ' THIS WEEK!';
  return '';
}
refreshBoard();
function buzz(pattern) { try { if (IS_TOUCH && navigator.vibrate) navigator.vibrate(pattern); } catch (e) {} }

/* ---- audio ---- */
let ac = null, muted = lsGet(GAME_ID + '.muted', '0') === '1', noiseBuf = null;
let eng = null; // engine + tire squeal nodes
function audio() {
  if (!ac) {
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; }
    if (ac) {
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const ch = noiseBuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
      try {
        const o = ac.createOscillator(), o2 = ac.createOscillator(), lp = ac.createBiquadFilter(), g = ac.createGain();
        o.type = 'sawtooth'; o2.type = 'square'; o2.detune.value = -1200 + 7;
        lp.type = 'lowpass'; lp.frequency.value = 520; lp.Q.value = 3; g.gain.value = 0;
        const g2 = ac.createGain(); g2.gain.value = 0.35; o2.connect(g2).connect(lp);
        o.connect(lp).connect(g).connect(ac.destination); o.start(); o2.start();
        const n = ac.createBufferSource(); n.buffer = noiseBuf; n.loop = true;
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2300; bp.Q.value = 7;
        const sg = ac.createGain(); sg.gain.value = 0; n.connect(bp).connect(sg).connect(ac.destination); n.start();
        eng = { o, o2, lp, g, sg, bp };
      } catch (e) { eng = null; }
    }
  }
  if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
  return ac;
}
function tone(f, dur, type = 'square', vol = 0.1, f2 = null, delay = 0) {
  if (muted || !ac) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.2, freq = 1200, type = 'lowpass', delay = 0) {
  if (muted || !ac || !noiseBuf) return;
  const t = ac.currentTime + delay, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(ac.destination); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}
const sfx = {
  start()   { [392, 523, 659, 784].forEach((f, i) => tone(f, 0.14, 'square', 0.07, null, i * 0.08)); },
  deliver() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.16, 'triangle', 0.11, null, i * 0.06)); tone(2093, 0.3, 'sine', 0.05, null, 0.3); },
  pickup()  { tone(880, 0.08, 'square', 0.06, 1320); tone(1320, 0.1, 'triangle', 0.06, 1760, 0.06); },
  crash()   { noise(0.6, 0.35, 900); tone(160, 0.5, 'sawtooth', 0.12, 40); tone(90, 0.4, 'square', 0.08, 30, 0.05); },
  bump()    { noise(0.15, 0.18, 500); tone(110, 0.12, 'square', 0.06, 70); },
  oil()     { tone(500, 0.5, 'triangle', 0.08, 140); noise(0.4, 0.08, 3000, 'bandpass'); },
  bank(m)   { const b = 600 + m * 90; tone(b, 0.1, 'square', 0.06); tone(b * 1.5, 0.16, 'square', 0.06, null, 0.07); },
  level()   { [523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, 0.12, 'square', 0.07, null, i * 0.09)); },
  miss()    { tone(330, 0.2, 'triangle', 0.08, 220); },
  warn()    { tone(1200, 0.07, 'square', 0.05); },
  over()    { [523, 440, 349, 262].forEach((f, i) => tone(f, 0.26, 'triangle', 0.1, null, i * 0.18)); },
  click()   { tone(700, 0.05, 'square', 0.05); },
};
function engineUpdate(speed, slip, active) {
  if (!eng || !ac) return;
  const t = ac.currentTime;
  const on = active && !muted;
  eng.o.frequency.setTargetAtTime(48 + speed * 0.22, t, 0.05);
  eng.o2.frequency.setTargetAtTime(48 + speed * 0.22, t, 0.05);
  eng.lp.frequency.setTargetAtTime(300 + speed * 1.4, t, 0.08);
  eng.g.gain.setTargetAtTime(on ? 0.045 : 0, t, 0.08);
  eng.sg.gain.setTargetAtTime(on && slip > 0 ? Math.min(0.06, slip * 0.09) : 0, t, 0.04);
  eng.bp.frequency.setTargetAtTime(1900 + slip * 900, t, 0.05);
}
function toggleMute() { muted = !muted; lsSet(GAME_ID + '.muted', muted ? '1' : '0'); audio(); if (!muted) sfx.click(); }

/* ---- road ---- */
let RP = [];
function resetRoad() { RP = [0, 0, 0, 0]; }
function ensureRoad(uptoD) {
  while ((RP.length - 3) * SEG < uptoD) {
    const prev = RP[RP.length - 1];
    const amp = Math.min(270, 100 + G.level * 28);
    let nx = Math.random() < 0.2 ? prev : prev + (Math.random() * 2 - 1) * amp;
    RP.push(nx);
  }
}
function cx(d) {
  if (d <= 0) return RP[0];
  const k = Math.floor(d / SEG), t = d / SEG - k;
  const p0 = RP[Math.max(0, k - 1)], p1 = RP[k], p2 = RP[k + 1] ?? p1, p3 = RP[k + 2] ?? p2;
  const t2 = t * t, t3 = t2 * t;
  return 0.5 * (2 * p1 + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
}
const roadAngle = d => Math.atan((cx(d + 6) - cx(d - 6)) / 12);

/* ---- game state ---- */
const G = {
  state: 'title', stateT: 0, t: 0, score: 0, bonus: 0, level: 1, lives: 3, heat: 100, deliveries: 0,
  bestDrift: 0, reason: '', entryHandled: false, camX: 0, shake: 0, banner: null, warnT: 0, flash: 0,
  nextTraffic: 0, nextDrop: 0, nextCoffee: 0, nextOil: 0, nextLamp: 0, hintT: 0,
};
let entryOpen = false;
const car = { x: 0, d: 0, th: 0, vx: 0, vd: 0, steerVis: 0, slip: 0, speed: 0, drifting: false, offroad: false,
  invuln: 0, spinT: 0, spinDur: 1, spinDir: 1, oilT: 0, braking: false, lastSkidD: 0 };
const drift = { pts: 0, t: 0, calm: 0 };
let traffic = [], items = [], parts = [], floats = [], skids = [];

const topSpeed = () => Math.min(500, 320 + (G.level - 1) * 20);
const carY = () => Math.round(H * 0.74);

function resetWorld() {
  resetRoad(); ensureRoad(3000);
  Object.assign(car, { x: 0, d: 0, th: 0, vx: 0, vd: 140, steerVis: 0, slip: 0, speed: 140, drifting: false, offroad: false,
    invuln: 0, spinT: 0, oilT: 0, braking: false, lastSkidD: 0 });
  traffic = []; items = []; parts = []; floats = []; skids = [];
  drift.pts = drift.t = drift.calm = 0;
  G.camX = 0; G.shake = 0;
}
function startGame() {
  audio();
  G.level = 1; resetWorld();
  Object.assign(G, { state: 'play', stateT: 0, t: 0, score: 0, bonus: 0, lives: 3, heat: 100, deliveries: 0, bestDrift: 0,
    reason: '', entryHandled: false, banner: { txt: 'GO!', sub: 'DELIVER THE ORDERS HOT', t: 0 }, warnT: 0, flash: 0,
    nextTraffic: 700, nextDrop: 1300, nextCoffee: 600, nextOil: 2600, hintT: 0 });
  MINE = null;
  sfx.start();
}
function gameOver(reason) {
  if (G.state !== 'play') return;
  bankDrift(false);
  G.state = 'over'; G.stateT = 0; G.reason = reason; G.entryHandled = false;
  sfx.over(); buzz([60, 40, 120]);
  refreshBoard();
}
function togglePause() {
  if (G.state === 'play') { G.state = 'paused'; engineUpdate(0, 0, false); }
  else if (G.state === 'paused') { G.state = 'play'; audio(); }
}
function confirm() {
  audio();
  if (entryOpen) return;
  if (G.state === 'title') startGame();
  else if (G.state === 'paused') togglePause();
  else if (G.state === 'over' && G.entryHandled && G.stateT > 1.3) startGame();
}

/* ---- effects ---- */
function addFloat(x, d, txt, color = '#fff', size = 22) { floats.push({ x, d, txt, color, size, t: 0 }); }
function smoke(x, d, n = 1, col = '200,200,215') {
  for (let i = 0; i < n; i++) parts.push({ x: x + rand(-3, 3), d: d + rand(-3, 3), vx: rand(-20, 20), vd: rand(-10, 30), life: 0, max: rand(0.6, 1.1), size: rand(6, 10), grow: 26, col, type: 'smoke' });
}
function sparks(x, d, n = 16, col = '255,210,90') {
  for (let i = 0; i < n; i++) { const a = rand(0, Math.PI * 2), s = rand(80, 320); parts.push({ x, d, vx: Math.cos(a) * s, vd: Math.sin(a) * s, life: 0, max: rand(0.25, 0.6), size: rand(1.5, 3), col, type: 'spark' }); }
}
function confetti(x, d, n = 34) {
  const cols = ['255,79,176', '255,216,74', '92,255,157', '90,200,255', '255,140,66'];
  for (let i = 0; i < n; i++) { const a = rand(0, Math.PI * 2), s = rand(60, 260); parts.push({ x, d, vx: Math.cos(a) * s, vd: Math.sin(a) * s + 80, life: 0, max: rand(0.7, 1.3), size: rand(3, 5), col: pick(cols), rot: rand(0, 6), type: 'conf' }); }
}
function addSkid(x1, d1, x2, d2, w = 4) { skids.push({ x1, d1, x2, d2, w }); if (skids.length > 900) skids.splice(0, skids.length - 900); }

/* ---- drift scoring ---- */
const driftMult = () => Math.min(5, 1 + Math.floor(drift.t / 1.1));
function bankDrift(keep = true) {
  if (drift.t <= 0) return;
  const amt = Math.round(drift.pts * driftMult());
  if (keep && amt >= 25) {
    G.bonus += amt; G.bestDrift = Math.max(G.bestDrift, amt);
    addFloat(car.x, car.d + 60, 'DRIFT +' + amt.toLocaleString(), '#ff4fb0', 24);
    sfx.bank(driftMult());
  } else if (!keep && amt >= 60) addFloat(car.x, car.d + 60, 'DRIFT LOST', '#9aa6c8', 20);
  drift.pts = drift.t = drift.calm = 0;
}

/* ---- spawning ---- */
const CAR_TYPES = ['sedan', 'sedan', 'sedan', 'van', 'pickup', 'truck'];
const CAR_COLS = ['#3a7bd5', '#f2c14e', '#43b581', '#dcdce6', '#9b59b6', '#ff8c42', '#2ec4b6', '#e8e05a'];
const LANES = [-LANE, 0, LANE];
function spawnAhead() {
  const ahead = car.d + carY() + 120;
  ensureRoad(ahead + 1200);
  while (G.nextTraffic < ahead) {
    const d = G.nextTraffic;
    const near = traffic.filter(t => Math.abs(t.d - d) < 220);
    const free = LANES.filter(l => !near.some(t => t.lane === l));
    if (free.length > 1 || (free.length === 1 && near.length < 2)) {
      const type = pick(CAR_TYPES);
      const lane = pick(free);
      traffic.push({ d, lane, off: lane, type, col: pick(CAR_COLS), speed: rand(140, 215) + G.level * 6 - (type === 'truck' ? 30 : 0),
        len: type === 'truck' ? 86 : type === 'van' ? 60 : 54, hit: false, x: cx(d) + lane, rot: 0, spin: 0, hvx: 0, hvd: 0, blink: rand(0, 6) });
    }
    G.nextTraffic += rand(270, 540) / (1 + (G.level - 1) * 0.12);
  }
  while (G.nextDrop < ahead) {
    const off = pick(LANES), side = off === 0 ? pick([-1, 1]) : Math.sign(off);
    items.push({ type: 'drop', d: G.nextDrop, off, side, r: 46, done: false, missed: false });
    G.nextDrop += rand(1900, 2500);
  }
  while (G.nextCoffee < ahead) {
    const d = G.nextCoffee;
    if (!items.some(i => i.type === 'drop' && Math.abs(i.d - d) < 200)) items.push({ type: 'coffee', d, off: pick(LANES) + rand(-14, 14), r: 22, done: false });
    G.nextCoffee += rand(650, 1100);
  }
  while (G.nextOil < ahead) {
    const d = G.nextOil;
    if (G.level >= 2 && !items.some(i => Math.abs(i.d - d) < 160)) items.push({ type: 'oil', d, off: pick(LANES) + rand(-10, 10), r: 26, done: false, seed: Math.random() * 100 });
    G.nextOil += rand(900, 1500) / (1 + (G.level - 2) * 0.1);
  }
}

/* ---- input ---- */
const keys = { left: false, right: false, down: false };
const touches = new Map(); // pointerId -> -1 | 1
let btns = [];
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}

/* ---- physics ---- */
function physics(dt, steer, brake, live) {
  const c = car;
  const roadC = cx(c.d), ang = roadAngle(c.d), off = c.x - roadC;
  const onRoad = Math.abs(off) <= ROADW / 2 + 4;
  c.offroad = !onRoad;
  if (c.spinT > 0) { c.spinT -= dt; steer = 0; brake = false; }
  if (c.oilT > 0) c.oilT -= dt;

  const fx = Math.sin(c.th), fy = Math.cos(c.th), rx = Math.cos(c.th), ry = -Math.sin(c.th);

  else vf = Math.max(target, vf - (onRoad ? 150 : 420) * dt);

  if (steer && spd0 > 220) grip = 3.2;
  if (brake && steer) grip = 1.8;
  if (!onRoad) grip = Math.min(grip, 4);
  if (c.oilT > 0 || c.spinT > 0) grip = 0.6;
  vl *= Math.exp(-grip * dt);

  c.x += c.vx * dt; c.d += c.vd * dt;

  const rc2 = cx(c.d), off2 = c.x - rc2;

    const s = Math.sign(off2);
    c.x = rc2 + s * WALL;

}

/* ---- update ---- */
function update(dt) {
  G.t += dt; G.stateT += dt;

  if (G.state === 'paused') return;

  if (G.state === 'title') {
    // attract mode: the car drives itself down an empty road
    if (!RP.length) resetWorld();
    ensureRoad(car.d + 3000);
    const target = cx(car.d + 160) + Math.sin(G.t * 0.7) * 50;
    const want = Math.atan2(target - car.x, 160);
    const steer = clamp((want - car.th) * 3, -1, 1);
    physics(dt, Math.abs(steer) > 0.2 ? Math.sign(steer) : 0, false, false);
    updateCamera(dt); updateParts(dt);
    engineUpdate(0, 0, false);
    return;
  }

  if (G.state === 'over') {
    // the car rolls to a stop
    const c = car; c.vx *= Math.exp(-2 * dt); c.vd *= Math.exp(-2 * dt);
    c.x += c.vx * dt; c.d += c.vd * dt;
    updateTraffic(dt); updateCamera(dt); updateParts(dt);
    engineUpdate(0, 0, false);
    if (!G.entryHandled && G.stateT > 1.1) { G.entryHandled = true; if (qualifies(G.score)) openEntry(); }
    return;
  }

  // --- play ---
  const ts = touchSides();
  let steer = 0;
  if (keys.left || ts.l) steer -= 1;
  if (keys.right || ts.r) steer += 1;
  let brake = keys.down || (ts.l && ts.r);
  if (ts.l && ts.r) steer = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (G.banner) { G.banner.t += dt; if (G.banner.t > 2.2) G.banner = null; }
  if (IS_TOUCH) G.hintT += dt;

  physics(dt, steer, brake, true);
  spawnAhead();
  updateTraffic(dt);
  updateItems(dt);
  updateCamera(dt);
  updateParts(dt);

  // drifting
  if (car.drifting) { drift.t += dt; drift.calm = 0; drift.pts += car.slip * car.speed * dt * 0.55; }
  else if (drift.t > 0) { drift.calm += dt; if (drift.calm > 0.35) bankDrift(true); }
  if (car.offroad && drift.t > 0.3) bankDrift(true);

  // food heat
  G.heat -= dt * (2.1 + G.level * 0.2 + (car.offroad ? 1.6 : 0));
  if (G.heat < 25) { G.warnT -= dt; if (G.warnT <= 0) { sfx.warn(); G.warnT = G.heat < 12 ? 0.4 : 0.8; } }
  if (G.heat <= 0) { G.heat = 0; gameOver('THE FOOD WENT COLD!'); }

  G.score = Math.floor(Math.max(0, car.d) / 8) + G.bonus;
  engineUpdate(car.speed, car.drifting || car.oilT > 0 ? Math.max(car.slip, 0.4) : (car.braking ? 0.3 : 0), true);
}

function crash(t) {
  const c = car;
  if (c.invuln > 0) return;
  bankDrift(false);
  G.lives--; c.invuln = 2.2;
  c.vx *= 0.4; c.vd *= 0.4; if (c.vd < 60) c.vd = 60;

  G.shake = 14; G.flash = 1;
  sparks((c.x + t.x) / 2, (c.d + t.d) / 2, 26); smoke(c.x, c.d, 8, '90,90,100');
  sfx.crash(); buzz([80, 40, 80]);
  addFloat(c.x, c.d + 50, G.lives > 0 ? 'CRASH!  ' + G.lives + ' LEFT' : 'WRECKED!', '#ff5a5a', 24);

function updateTraffic(dt) {
  for (const t of traffic) {
    if (t.hit) {

        addFloat(x, it.d + 10, 'TIP $' + (tip / 40).toFixed(2), '#ffd84a', 18);

function updateCamera(dt) {
  const want = car.x * 0.55 + cx(car.d + 260) * 0.45;
  G.camX += (want - G.camX) * Math.min(1, 4 * dt);
}

function updateParts(dt) {
  for (const p of parts) {
    p.life += dt; p.x += p.vx * dt; p.d += p.vd * dt;

/* ---- world rendering ---- */
function drawWorld() {
  CY = carY(); camD = car.d;
  const dTop = camD + CY + 40, dBot = camD - (H - CY) - 40;
  ensureRoad(dTop + 400);

  // grass with speed bands
  ctx.fillStyle = '#10261a'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#132d1f';
  for (let d = Math.floor(dBot / 80) * 80; d < dTop; d += 80) if (Math.floor(d / 80) % 2 === 0) ctx.fillRect(0, sy(d + 80), W, 80);
  // grass tufts
  ctx.fillStyle = 'rgba(80,140,80,.18)';
  for (let k = Math.floor(dBot / 40); k < dTop / 40; k++) {
    for (let i = 0; i < 3; i++) {
      const h = hash(k * 7 + i), xx = (h * 1400) - 700 + G.camX - W / 2;
      ctx.fillRect(sx(xx) | 0, sy(k * 40 + hash(k + i * 13) * 40) | 0, 3, 2);
    }
  }

  // road geometry
  const STEP = 8, pts = [];
  for (let d = Math.floor(dBot / STEP) * STEP; d <= dTop; d += STEP) pts.push({ d, c: sx(cx(d)), y: sy(d) });
  const band = (o1, o2, fill) => {
    ctx.beginPath();
    for (let i = 0; i < pts.length; i++) ctx[i ? 'lineTo' : 'moveTo'](pts[i].c + o1, pts[i].y);
    for (let i = pts.length - 1; i >= 0; i--) ctx.lineTo(pts[i].c + o2, pts[i].y);
    ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
  };
  // gravel shoulders out to the rail
  band(-WALL - 8, WALL + 8, '#2a2a26');
  band(-ROADW / 2 - 16, ROADW / 2 + 16, '#3a3836');
  // asphalt
  band(-ROADW / 2, ROADW / 2, '#272834');
  // asphalt patches
  for (let k = Math.floor(dBot / 120); k < dTop / 120; k++) {
    const h = hash(k * 3.1);
    if (h > 0.55) continue;
    const d = k * 120 + h * 100, o = (hash(k * 5.7) - 0.5) * (ROADW - 60);
    ctx.fillStyle = h < 0.25 ? 'rgba(0,0,0,.14)' : 'rgba(255,255,255,.025)';
    ctx.beginPath(); ctx.ellipse(sx(cx(d) + o), sy(d), 18 + h * 30, 10 + h * 12, h * 3, 0, Math.PI * 2); ctx.fill();
  }
  // rumble strips
  for (const side of [-1, 1]) {
    for (const col of [0, 1]) {
      ctx.beginPath();
      for (let i = 0; i < pts.length - 1; i++) {
        if (((Math.floor(pts[i].d / 24) % 2) + 2) % 2 !== col) continue;
        const a = pts[i], b = pts[i + 1], o1 = side * ROADW / 2, o2 = side * (ROADW / 2 + 12);
        ctx.moveTo(a.c + o1, a.y); ctx.lineTo(b.c + o1, b.y); ctx.lineTo(b.c + o2, b.y); ctx.lineTo(a.c + o2, a.y); ctx.closePath();
      }
      ctx.fillStyle = col ? '#f2f2f2' : '#d8262e'; ctx.fill();
    }
  }
  // lines
  ctx.lineCap = 'butt';
  ctx.strokeStyle = 'rgba(245,240,225,.85)'; ctx.lineWidth = 3;
  for (const o of [-ROADW / 2 + 7, ROADW / 2 - 7]) {
    ctx.beginPath(); for (let i = 0; i < pts.length; i++) ctx[i ? 'lineTo' : 'moveTo'](pts[i].c + o, pts[i].y); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(255,216,74,.9)'; ctx.lineWidth = 4;
  for (const o of [-LANE / 2, LANE / 2]) {
    ctx.beginPath();
    for (let i = 0; i < pts.length - 1; i++) {
      if (((Math.floor(pts[i].d / 44) % 2) + 2) % 2) continue;
      ctx.moveTo(pts[i].c + o, pts[i].y); ctx.lineTo(pts[i + 1].c + o, pts[i + 1].y);
    }
    ctx.stroke();
  }

  // skid marks
  ctx.strokeStyle = 'rgba(8,8,12,.55)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath();
  for (const s of skids) {
    if (s.d1 < dBot || s.d1 > dTop) continue;
    ctx.moveTo(sx(s.x1), sy(s.d1)); ctx.lineTo(sx(s.x2), sy(s.d2));
  }
  ctx.stroke();

  // street lamps (light pools first)
  const lamps = [];
  for (let k = Math.floor(dBot / 360) - 1; k < dTop / 360 + 1; k++) {
    const d = k * 360 + 180, side = k % 2 ? 1 : -1;
    lamps.push({ x: sx(cx(d) + side * (WALL + 2)), y: sy(d) });
  }
  for (const l of lamps) lampGlow(l.x, l.y);

  // items on the road
  for (const it of items) {
    if (it.d < dBot - 60 || it.d > dTop + 80) continue;
    if (it.type === 'oil' && !it.done) drawOil(it);
  }
  for (const it of items) {
    if (it.d < dBot - 60 || it.d > dTop + 80) continue;
    if (it.type === 'drop') drawDrop(it);
    else if (it.type === 'coffee' && !it.done) drawCoffee(it);
  }

  // guard rails
  for (const side of [-1, 1]) {
    ctx.strokeStyle = '#8890a4'; ctx.lineWidth = 3;
    ctx.beginPath(); for (let i = 0; i < pts.length; i++) ctx[i ? 'lineTo' : 'moveTo'](pts[i].c + side * (WALL + 4), pts[i].y); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1;
    ctx.beginPath(); for (let i = 0; i < pts.length; i++) ctx[i ? 'lineTo' : 'moveTo'](pts[i].c + side * (WALL + 3), pts[i].y); ctx.stroke();
    ctx.fillStyle = '#5a6070';
    for (let i = 0; i < pts.length; i++) if (((Math.floor(pts[i].d / STEP)) % 5) === 0) ctx.fillRect(pts[i].c + side * (WALL + 4) - 2, pts[i].y - 2, 4, 4);
  }
  for (const l of lamps) drawLamp(l.x, l.y);

  // scenery beyond the rails
  for (let k = Math.floor(dBot / 150) - 1; k < dTop / 150 + 1; k++) {
    for (const side of [-1, 1]) {
      const h = hash(k * 2 + (side > 0 ? 1 : 0));
      const d = k * 150 + h * 120;
      if (items.some(it => it.type === 'drop' && it.side === side && Math.abs(it.d - d) < 90)) continue;
      const o = WALL + 46 + hash(k * 9 + side) * 150;
      const x = sx(cx(d) + side * o), y = sy(d);
      if (x < -60 || x > W + 60) continue;
      if (h < 0.42) drawTree(x, y, 0.8 + hash(k + 3) * 0.6, hash(k + 1));
      else if (h < 0.7) drawPine(x, y, 0.8 + hash(k + 5) * 0.5);
      else if (h < 0.8) drawHouse(x, y, ['#8a3a3a', '#3a6a5a', '#7a6a3a', '#5a4a7a'][(h * 40 | 0) % 4], hash(k + 8) < 0.6, 0.8);
      else if (h < 0.88) drawSign(sx(cx(d) + side * (WALL + 34)), y, k);
      else { circle(x, y, 9, '#1d4a2a'); circle(x + 9, y + 4, 7, '#245a32'); circle(x - 7, y + 5, 6, '#1a3f24'); }
    }
  }

  // headlight beams
  for (const t of traffic) {
    const y = sy(t.d); if (y < -220 || y > H + 80) continue;
    ctx.save(); ctx.translate(sx(t.x), y); ctx.rotate(t.rot); headlightCone(150, 34, 0.15); ctx.restore();
  }
  const pAng = car.th + spinAngle();
  ctx.save(); ctx.translate(sx(car.x), sy(car.d)); ctx.rotate(pAng); headlightCone(220, 52, 0.3); ctx.restore();

  // cars
  for (const t of traffic) {
    const y = sy(t.d); if (y < -60 || y > H + 60) continue;
    ctx.save(); ctx.translate(sx(t.x), y); ctx.rotate(t.rot); drawTrafficCar(t); ctx.restore();
  }
  ctx.save(); ctx.translate(sx(car.x), sy(car.d)); ctx.rotate(pAng);
  drawPlayerCar(car.steerVis, car.braking, car.invuln > 0 && G.state === 'play' && Math.floor(car.invuln * 12) % 2 === 0);
  ctx.restore();

  // particles
  for (const p of parts) {
    const k = p.life / p.max, x = sx(p.x), y = sy(p.d);
    if (p.type === 'smoke') circle(x, y, p.size, `rgba(${p.col},${0.28 * (1 - k)})`);
    else if (p.type === 'spark') { ctx.save(); ctx.globalCompositeOperation = 'lighter'; circle(x, y, p.size * (1 - k * 0.5), `rgba(${p.col},${1 - k})`); ctx.restore(); }
    else { ctx.save(); ctx.translate(x, y); ctx.rotate(p.rot); ctx.fillStyle = `rgba(${p.col},${1 - k})`; ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore(); }
  }
  for (const f of floats) {
    const k = f.t / 1.4, y = sy(f.d) - f.t * 50;
    ctx.save(); ctx.globalAlpha = 1 - k * k;
    ctx.font = `italic 900 ${f.size}px ${UI_FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.strokeText(f.txt, sx(f.x), y);
    ctx.fillStyle = f.color; ctx.fillText(f.txt, sx(f.x), y);
    ctx.restore();
  }

  // night vignette
  ctx.fillStyle = rad(W / 2, CY - 120, 160, Math.max(W, H) * 0.75, [[0, 'rgba(8,4,30,0)'], [1, 'rgba(8,4,30,.6)']]);
  ctx.fillRect(0, 0, W, H);
}
function spinAngle() {
  if (car.spinT <= 0) return 0;
  const k = 1 - car.spinT / car.spinDur;
  return car.spinDir * Math.PI * 2 * (1 - Math.pow(1 - k, 3));
}

/* ---- HUD + overlays ---- */
function drawHUD() {
  ctx.fillStyle = lin(0, 0, 0, HUD, [[0, 'rgba(10,6,28,.96)'], [1, 'rgba(10,6,28,.82)']]); ctx.fillRect(0, 0, W, HUD);
  ctx.fillStyle = lin(0, 0, W, 0, [[0, '#ff4fb0'], [0.5, '#ffd84a'], [1, '#5ac8ff']]); ctx.fillRect(0, HUD - 2, W, 2);
  text('SCORE', 12, 16, 10, '#b8a6d6', 'left', '800', 2);
  text(G.score.toLocaleString(), 12, 38, 22, '#ffffff', 'left', '900');
  // food heat
  const bx = 150, bw = 150, by = 30, bh = 14;
  text('FOOD HEAT', bx, 16, 10, '#b8a6d6', 'left', '800', 2);
  text('LV ' + G.level, bx + bw, 16, 10, '#ffd84a', 'right', '900', 1);
  rr(bx, by, bw, bh, 7); ctx.fillStyle = '#1a1030'; ctx.fill();
  const k = clamp(G.heat / 100, 0, 1);
  const col = k > 0.6 ? ['#ffd84a', '#ff5a2a'] : k > 0.3 ? ['#ffe08a', '#ffa02a'] : ['#b8ecff', '#4a9aff'];
  const blink = k < 0.25 && Math.floor(G.t * 6) % 2 === 0;
  if (k > 0) { rr(bx + 2, by + 2, Math.max(10, (bw - 4) * k), bh - 4, 5); ctx.fillStyle = blink ? '#ffffff' : lin(bx, 0, bx + bw, 0, [[0, col[1]], [1, col[0]]]); ctx.fill(); }
  rr(bx, by, bw, bh, 7); ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1; ctx.stroke();
  // steam wisps when hot
  if (k > 0.6) {
    ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 1.5;
    for (let i = 0; i < 3; i++) { const x = bx + 20 + i * 40 + Math.sin(G.t * 3 + i) * 3; ctx.beginPath(); ctx.moveTo(x, by); ctx.quadraticCurveTo(x + 4, by - 4, x, by - 8); ctx.stroke(); }
  }
  // lives as little cars
  for (let i = 0; i < 3; i++) {
    ctx.save(); ctx.translate(322 + i * 18, 30); ctx.scale(0.36, 0.36);
    if (i < G.lives) drawPlayerCar(0, false, false);
    else { rr(-15, -28, 30, 56, 10); ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fill(); }
    ctx.restore();
  }
  // mute + pause
  glassButton(380, 11, 40, 36); iconSpeaker(400, 29, muted); btns.push({ x: 380, y: 8, w: 40, h: 42, act: toggleMute });
  if (G.state === 'play' || G.state === 'paused') {
    glassButton(428, 11, 40, 36, G.state === 'paused');
    ctx.fillStyle = '#fff'; ctx.fillRect(441, 21, 5, 16); ctx.fillRect(450, 21, 5, 16);
    btns.push({ x: 428, y: 8, w: 44, h: 42, act: togglePause });
  }
}
function drawPlayOverlays() {
  // drift meter
  if (drift.t > 0.15) {
    const m = driftMult(), y = HUD + 70, pulse = 1 + Math.sin(G.t * 18) * 0.04;
    ctx.save(); ctx.translate(W / 2, y); ctx.scale(pulse, pulse);
    bigText('DRIFT ×' + m, 0, 0, 30 + m * 2, '#ffffff', m >= 4 ? '#ffd84a' : '#ff4fb0');
    ctx.restore();
    text(Math.round(drift.pts * m).toLocaleString(), W / 2, y + 30, 18, '#ffd0ee', 'center', '900');
  }
  // next drop arrow
  const next = items.find(it => it.type === 'drop' && !it.done);
  if (next) {
    const y = sy(next.d);
    if (y < HUD + 10) {
      const x = clamp(sx(cx(next.d) + next.off), 40, W - 40), dist = Math.round((next.d - car.d) / 10);
      const by = HUD + 22 + Math.sin(G.t * 6) * 3;
      ctx.save(); ctx.shadowColor = '#5cff9d'; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.moveTo(x, by - 12); ctx.lineTo(x + 12, by + 4); ctx.lineTo(x - 12, by + 4); ctx.closePath(); ctx.fillStyle = '#5cff9d'; ctx.fill();
      ctx.restore();
      text('DROP ' + dist + 'm', x, by + 18, 12, '#cfffe0', 'center', '900', 1);
    }
  }
  // banner
  if (G.banner) {
    const b = G.banner, a = b.t < 0.2 ? b.t / 0.2 : b.t > 1.8 ? (2.2 - b.t) / 0.4 : 1;
    ctx.save(); ctx.globalAlpha = clamp(a, 0, 1);
    const sc = b.t < 0.2 ? 1.6 - b.t * 3 : 1;
    ctx.translate(W / 2, H * 0.36); ctx.scale(sc, sc);
    bigText(b.txt, 0, 0, 54, '#ffffff', '#ff4fb0');
    ctx.restore();
    ctx.save(); ctx.globalAlpha = clamp(a, 0, 1); text(b.sub, W / 2, H * 0.36 + 42, 15, '#ffd84a', 'center', '900', 2); ctx.restore();
  }
  // touch steering pads
  if (IS_TOUCH) {
    const ts = touchSides(), a = G.hintT < 6 ? 1 : 0.45;
    const py = H - 96;
    ctx.save(); ctx.globalAlpha = a;
    for (const s of [-1, 1]) {
      const x = s < 0 ? 16 : W - 16 - 110, on = s < 0 ? ts.l : ts.r;
      rr(x, py, 110, 76, 22); ctx.fillStyle = on ? 'rgba(255,79,176,.35)' : 'rgba(255,255,255,.07)'; ctx.fill();
      ctx.strokeStyle = on ? 'rgba(255,150,220,.9)' : 'rgba(255,255,255,.25)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = on ? '#fff' : 'rgba(255,255,255,.7)';
      const ax = x + 55;
      ctx.beginPath(); ctx.moveTo(ax + s * 18, py + 38); ctx.lineTo(ax - s * 10, py + 22); ctx.lineTo(ax - s * 10, py + 54); ctx.closePath(); ctx.fill();
    }
    if (G.hintT < 6) text('HOLD A SIDE TO STEER · HOLD BOTH TO BRAKE', W / 2, py - 14, 11, 'rgba(255,255,255,.75)', 'center', '800', 1);
    ctx.restore();
  }
  if (G.flash > 0) { ctx.fillStyle = `rgba(255,60,60,${G.flash * 0.25})`; ctx.fillRect(0, 0, W, H); }
}
function drawTitle() {
  const pw = 420, px = (W - pw) / 2, py = H * 0.12, ph = 470;
  panel(px, py, pw, ph);
  bigText('TURBO', W / 2, py + 54, 58, '#ffffff', '#ff4fb0');
  bigText('DRIFT', W / 2, py + 108, 58, '#ffffff', '#5ac8ff');
  text('★ DINER DELIVERY DASH ★', W / 2, py + 150, 13, '#ffd84a', 'center', '900', 3);
  const lines = [
    ['◀ ▶', IS_TOUCH ? 'Hold the left or right side to steer' : 'Arrow keys or A / D to steer'],
    ['DRIFT', 'Slide through the curves to bank points'],
    ['DROP', 'Drive over the green zones to deliver'],
    ['☕', 'Coffee keeps the food hot · dodge cars & oil'],
    ['▼', IS_TOUCH ? 'Hold both sides to brake' : '↓ or Space to brake'],
  ];
  lines.forEach(([k, s], i) => {
    const y = py + 192 + i * 38;
    rr(px + 22, y - 13, 62, 26, 13); ctx.fillStyle = ['#ff4fb0', '#b04fff', '#2aa868', '#d07a20', '#4a7aff'][i]; ctx.fill();
    text(k, px + 53, y + 1, 12, '#fff', 'center', '900', 1);
    text(s, px + 96, y + 1, 14, '#ece6ff', 'left', '700');
  });
  const best = BOARD[0];
  text(best ? 'HIGH SCORE  ' + best.name + '  ' + Number(best.score).toLocaleString() : 'NO HIGH SCORE YET — BE THE FIRST!', W / 2, py + 392, 13, '#b8a6d6', 'center', '800', 1);
  const blink = Math.floor(G.t * 2) % 2 === 0;
  if (blink) text(IS_TOUCH ? 'TAP TO START' : 'PRESS ENTER TO START', W / 2, py + 432, 22, '#ffffff', 'center', '900', 3);
  button(14, H - 58, 120, 42, '◀ ARCADE', () => { location.href = '/'; }, false, 15);
}
function drawPaused() {
  ctx.fillStyle = 'rgba(6,4,20,.55)'; ctx.fillRect(0, HUD, W, H - HUD);
  const pw = 320, px = (W - pw) / 2, py = H * 0.3;
  panel(px, py, pw, 220);
  bigText('PAUSED', W / 2, py + 52, 46);
  button(px + 40, py + 100, pw - 80, 46, 'RESUME', togglePause, true);
  button(px + 40, py + 156, pw - 80, 42, 'QUIT TO ARCADE', () => { location.href = '/'; }, false, 15);
}
function drawOver() {
  ctx.fillStyle = `rgba(6,4,20,${Math.min(0.6, G.stateT)})`; ctx.fillRect(0, HUD, W, H - HUD);
  if (G.stateT < 0.5) return;
  const pw = 420, px = (W - pw) / 2, py = HUD + 30, ph = Math.min(H - HUD - 60, 640);
  panel(px, py, pw, ph);
  bigText('GAME OVER', W / 2, py + 46, 44);
  text(G.reason, W / 2, py + 84, 15, '#ffd84a', 'center', '900', 1);
  text(G.score.toLocaleString(), W / 2, py + 122, 38, '#ffffff', 'center', '900');
  text(G.deliveries + (G.deliveries === 1 ? ' DELIVERY' : ' DELIVERIES') + '  ·  LEVEL ' + G.level + '  ·  BEST DRIFT ' + G.bestDrift.toLocaleString(), W / 2, py + 156, 12, '#b8a6d6', 'center', '800', 1);
  const rl = rankLine(); if (rl) text(rl, W / 2, py + 180, 14, '#5cff9d', 'center', '900', 1);
  text(BOARD_SHARED ? 'TOP 10 · ALL-TIME' : 'TOP 10 · THIS DEVICE', W / 2, py + 210, 12, '#ff9ad6', 'center', '900', 3);
  const rows = BOARD.slice(0, 10), rowH = Math.min(26, (ph - 330) / 10);
  rows.forEach((e, i) => {
    const y = py + 236 + i * rowH;
    const me = MINE && e.name === MINE.name && e.score === MINE.score;
    if (me) { rr(px + 40, y - rowH / 2 + 1, pw - 80, rowH - 2, 6); ctx.fillStyle = 'rgba(92,255,157,.18)'; ctx.fill(); }
    text(String(i + 1).padStart(2, ' '), px + 66, y, 14, i < 3 ? '#ffd84a' : '#b8a6d6', 'right', '900');
    text(e.name, px + 92, y, 15, '#ffffff', 'left', '900', 2);
    text(Number(e.score).toLocaleString(), px + pw - 56, y, 15, '#ffffff', 'right', '800');
  });
  if (!rows.length) text('No scores yet', W / 2, py + 250, 14, '#b8a6d6');
  if (G.entryHandled && !entryOpen && G.stateT > 1.3) {
    button(px + 40, py + ph - 108, pw - 80, 48, IS_TOUCH ? 'PLAY AGAIN' : 'PLAY AGAIN (ENTER)', startGame, true, 18);
    button(px + 40, py + ph - 52, pw - 80, 38, '◀ ARCADE', () => { location.href = '/'; }, false, 14);
  }
}

function draw() {
  btns = [];
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.save();
  if (G.shake > 0) ctx.translate(rand(-G.shake, G.shake), rand(-G.shake, G.shake));
  drawWorld();
  ctx.restore();
  if (G.state === 'play') drawPlayOverlays();
  if (G.state !== 'title') drawHUD();
  if (G.state === 'title') drawTitle();
  if (G.state === 'paused') drawPaused();
  if (G.state === 'over') drawOver();
}

/* ---- initials entry ---- */
const iniBox = document.getElementById('ini'), iniForm = iniBox.querySelector('form');
const iniIn = document.getElementById('iniIn'), iniMsg = document.getElementById('iniMsg');
const iniSave = document.getElementById('iniSave'), iniSkip = document.getElementById('iniSkip');
function openEntry() {
  entryOpen = true; iniBox.hidden = false; iniMsg.textContent = ''; iniSave.disabled = false;
  document.getElementById('iniScore').textContent = G.score.toLocaleString() + ' POINTS · LEVEL ' + G.level;
  iniIn.value = lsGet(GAME_ID + '.initials', '');
  setTimeout(() => { try { iniIn.focus(); iniIn.select(); } catch (e) {} }, 60);
}
function closeEntry() { entryOpen = false; iniBox.hidden = true; G.stateT = Math.max(G.stateT, 1.3); try { iniIn.blur(); } catch (e) {} }
iniIn.addEventListener('input', () => { iniIn.value = iniIn.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 3); });
iniForm.addEventListener('submit', async e => {
  e.preventDefault();
  const name = iniIn.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 3);
  if (!name) { iniMsg.textContent = 'Enter 1 to 3 letters or numbers.'; return; }
  lsSet(GAME_ID + '.initials', name);
  iniSave.disabled = true; iniMsg.textContent = '';
  const res = await submitScore(name, G.score, G.level);
  if (res === true) closeEntry(); else { iniMsg.textContent = res; iniSave.disabled = false; }
});
iniSkip.addEventListener('click', closeEntry);

/* ---- game loop ---- */
fit();
resetWorld();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.04, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
